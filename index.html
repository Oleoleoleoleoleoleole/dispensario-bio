function labHTML(id){if(id==='pcr')return `<div class="labh"><span class="eyebrow">01 · AMPLIFICAZIONE</span><h2>PCR: da una copia a milioni</h2><p>Esplora i tre passaggi del ciclo e modifica l’efficienza dell’amplificazione.</p></div><div class="lab-layout"><div class="panel lab-controls"><div><div class="rangehead"><label for="pcrCycles">Cicli</label><output id="pcrCycleOut">25</output></div><input class="range" type="range" id="pcrCycles" min="1" max="40" value="25"></div><div><div class="rangehead"><label for="pcrEff">Efficienza per ciclo</label><output id="pcrEffOut">90%</output></div><input class="range" type="range" id="pcrEff" min="50" max="100" step="5" value="90"></div><div><label>Fasi di un ciclo</label><div class="stepper"><button data-phase="0">1. Denatura</button><button data-phase="1">2. Appaia</button><button data-phase="2">3. Estendi</button></div></div><div class="formula"><div class="number" id="pcrResult">—</div><div class="number-caption">Copie teoriche da una molecola iniziale</div></div><div class="lab-note"><strong>Modello:</strong> N = N₀ · (1 + E)ⁿ. L’efficienza reale non resta costante indefinitamente: reagenti e inibitori limitano la reazione.</div></div><div class="panel lab-results"><div id="pcrDrawing" class="lab-chart" aria-label="Schema delle fasi della PCR"></div><p id="pcrDescription" style="margin:14px 0 0"></p></div></div>`;
if(id==='qpcr')return `<div class="labh"><span class="eyebrow">02 · QUANTIFICAZIONE</span><h2>qPCR: confronta due campioni</h2><p>Osserva come una diversa quantità iniziale di DNA influenzi il ciclo di soglia (Ct).</p></div><div class="lab-layout"><div class="panel lab-controls"><div><div class="rangehead"><label for="qA">DNA iniziale, campione A (log₁₀)</label><output id="qAOut">4</output></div><input class="range" id="qA" type="range" min="1" max="7" value="4"></div><div><div class="rangehead"><label for="qB">DNA iniziale, campione B (log₁₀)</label><output id="qBOut">6</output></div><input class="range" id="qB" type="range" min="1" max="7" value="6"></div><div class="formula"><div class="number" id="qResult">—</div><div class="number-caption">Differenza Ct (A − B), approssimata</div></div><div class="lab-note"><strong>Nota:</strong> con efficienza 100%, 10× di templato corrisponde a circa 3,32 cicli. Nella pratica servono controlli e valutazione dell’efficienza.</div></div><div class="panel lab-results"><div id="qDrawing" class="lab-chart" aria-label="Grafico di fluorescenza qPCR"></div><p class="mini" style="margin:12px 0 0">Curva illustrativa con soglia fissa, non dati sperimentali.</p></div></div>`;
if(id==='gel')return `<div class="labh"><span class="eyebrow">03 · TECNICHE DI SEPARAZIONE</span><h2>Elettroforesi: leggi il gel</h2><p>Cambia campione e osserva come la dimensione del DNA modifica la migrazione.</p></div><div class="lab-layout"><div class="panel lab-controls"><div><label for="gelSample">Campione</label><select class="field" id="gelSample"><option value="a">A · 1500, 600, 220 bp</option><option value="b">B · 1000, 1000, 300 bp</option><option value="c">C · 2400 bp</option></select></div><div class="formula"><div id="gelResult">—</div></div><div class="lab-note"><strong>Ricorda:</strong> a parità di gel e condizioni, i frammenti più piccoli tendono a migrare più lontano. Le bande della stessa dimensione si sovrappongono.</div></div><div class="panel lab-results"><div class="gelview" id="gelDrawing"></div><p class="mini" style="margin:12px 0 0">Marker didattico a sinistra; campione selezionato a destra. Verso di migrazione: ↓</p></div></div>`;
if(id==='crispr')return `<div class="labh"><span class="eyebrow">04 · EDITING GENOMICO</span><h2>CRISPR: trova i siti PAM</h2><p>Esamina una sequenza dimostrativa alla ricerca del motivo 5′-NGG-3′, utilizzato da SpCas9.</p></div><div class="lab-layout"><div class="panel lab-controls"><div><label for="crisprSeq">Sequenza DNA (5′ → 3′)</label><textarea id="crisprSeq" class="sequence" spellcheck="false" autocapitalize="characters">ATGCTAACGTTAGCGATCTGACCTGGATCGACTAGCATGGCTAACCGTTAACCGGTCGATCGTTACCTGAAGGATC</textarea></div><button class="btn" data-action="scancrispr">Cerca PAM →</button><div class="lab-note"><strong>Attenzione:</strong> riconoscere un PAM non basta per scegliere una guida: contano complementarità, specificità, accessibilità e off-target. Questa non è una procedura sperimentale.</div></div><div class="panel lab-results"><h3>Risultati</h3><div id="crisprResult" class="mini" style="margin:12px 0">Premi «Cerca PAM».</div></div></div>`;
if(id==='plasmid')return `<div class="labh"><span class="eyebrow">05 · DNA RICOMBINANTE</span><h2>Costruisci un vettore di espressione</h2><p>Scopri perché un promotore deve essere compatibile con il sistema ospite.</p></div><div class="lab-layout"><div class="panel lab-controls"><div><label for="plHost">Sistema ospite</label><select class="field" id="plHost"><option value="bacteria">E. coli (batterio)</option><option value="mammalian">Cellule di mammifero</option></select></div><div><label for="plProm">Promotore</label><select class="field" id="plProm"><option value="bacteria">Promotore batterico (es. lac)</option><option value="mammalian">Promotore eucariotico (es. CMV)</option></select></div><div><label for="plGene">Transgene dimostrativo</label><select class="field" id="plGene"><option>GFP (proteina fluorescente)</option><option>Proteina terapeutica</option><option>Antigene ricombinante</option></select></div><div class="formula" id="plResult"></div><div class="lab-note"><strong>Semplificazione:</strong> una produzione reale richiede anche origine di replicazione, selezione, segnali di terminazione e un sistema di espressione adeguato.</div></div><div class="panel lab-results"><div id="plDrawing" class="lab-chart"></div></div></div>`;
return `<div class="labh"><span class="eyebrow">06 · MEDICINA PERSONALIZZATA</span><h2>Farmacogenomica: ragiona sul genotipo</h2><p>Combina due alleli illustrativi e osserva un esempio di classificazione dell’attività enzimatica.</p></div><div class="lab-layout"><div class="panel lab-controls"><div><label for="pgxA">Allele 1</label><select class="field" id="pgxA"><option value="1">*1 · funzione normale</option><option value="2">*2 · non funzionale (esempio)</option><option value="17">*17 · funzione aumentata (esempio)</option></select></div><div><label for="pgxB">Allele 2</label><select class="field" id="pgxB"><option value="1">*1 · funzione normale</option><option value="2">*2 · non funzionale (esempio)</option><option value="17">*17 · funzione aumentata (esempio)</option></select></div><div class="formula" id="pgxResult"></div><div class="lab-note"><strong>Solo per studio:</strong> questi alleli rappresentano un esempio schematico ispirato a CYP2C19; la classificazione reale dipende dal gene, dal farmaco, dalle linee guida e da ulteriori varianti. Non usarla per decidere terapie o dosaggi.</div></div><div class="panel lab-results"><div id="pgxDrawing" class="lab-chart"></div></div></div>`}
function labInit(){if(activeLab==='pcr'){updatePCR();phasePCR(pcrPhase)}else if(activeLab==='qpcr')updateQPCR();else if(activeLab==='gel')updateGel();else if(activeLab==='crispr')scanCRISPR();else if(activeLab==='plasmid')updatePlasmid();else updatePGX()}
function svg(inner,w=600,hh=230){return `<svg viewBox="0 0 ${w} ${hh}" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`}
function nice(n){return Number.isFinite(n)?new Intl.NumberFormat('it-IT',{maximumFractionDigits:0}).format(Math.round(n)):'—'}
function updatePCR(){const cycles=+$('#pcrCycles').value,eff=+$('#pcrEff').value;$('#pcrCycleOut').textContent=cycles;$('#pcrEffOut').textContent=eff+'%';$('#pcrResult').textContent=nice(Math.pow(1+eff/100,cycles))}
function phasePCR(n){pcrPhase=n;$$('[data-phase]').forEach(x=>x.classList.toggle('active',+x.dataset.phase===n));const texts=['A circa 94–98 °C, i legami a idrogeno tra le due catene si rompono e i filamenti si separano.','La temperatura diminuisce: i primer riconoscono le sequenze complementari sui due stampi. La temperatura esatta dipende dai primer.','Una DNA polimerasi termostabile estende i primer in direzione 5′→3′, producendo nuove catene complementari.'];$('#pcrDescription').textContent=texts[n];const y=n===0?[67,154]:n===1?[73,148]:[83,139];let draw=`<text x="18" y="24" fill="currentColor" font-size="14" font-weight="700">${['Denaturazione','Annealing · primer','Estensione'][n]}</text><rect x="32" y="${y[0]}" width="525" height="8" rx="4" fill="#438afa"/><rect x="32" y="${y[1]}" width="525" height="8" rx="4" fill="#16ab9d"/>`;if(n>0){draw+=`<rect x="32" y="${y[0]+14}" width="${n===1?85:525}" height="8" rx="4" fill="#e69b34"/><rect x="${n===1?473:32}" y="${y[1]-14}" width="${n===1?85:525}" height="8" rx="4" fill="#e69b34"/>`;}if(n===2)draw+=`<text x="170" y="115" font-size="13" fill="currentColor">Filamenti complementari sintetizzati</text>`;$('#pcrDrawing').innerHTML=svg(draw,590,220)}
function updateQPCR(){const a=+$('#qA').value,b=+$('#qB').value;$('#qAOut').textContent=`10^${a}`;$('#qBOut').textContent=`10^${b}`;const ct=x=>Math.max(0,Math.log2(1e12/Math.pow(10,x)));$('#qResult').textContent=(ct(a)-ct(b)).toFixed(2).replace('.',',')+' cicli';const X=c=>42+c/40*520,Y=x=>208-165*x;let el=`<line x1="42" y1="208" x2="570" y2="208" stroke="#8091a7"/><line x1="42" y1="24" x2="42" y2="208" stroke="#8091a7"/><line x1="42" y1="100" x2="570" y2="100" stroke="#e7a345" stroke-dasharray="5 4"/><text x="480" y="92" font-size="11" fill="#c08732">Soglia</text><text x="250" y="232" font-size="13" fill="currentColor">Ciclo</text>`;[0,10,20,30,40].forEach(t=>el+=`<text x="${X(t)}" y="223" font-size="10" fill="currentColor" text-anchor="middle">${t}</text>`);const lines=[[a,'#438afa'],[b,'#16ab9d']];for(const [power,color] of lines){let points=[];for(let c=0;c<=40;c++){let v=1/(1+Math.exp(-.58*(c-(ct(power)+4))));points.push(`${X(c)},${Y(v)}`)}el+=`<polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="3.8" stroke-linejoin="round"/>`;}el+=`<text x="78" y="32" fill="#438afa" font-size="13" font-weight="700">A</text><text x="110" y="32" fill="#16ab9d" font-size="13" font-weight="700">B</text>`;$('#qDrawing').innerHTML=svg(el,590,240)}
const bands={a:[1500,600,220],b:[1000,1000,300],c:[2400]};
function updateGel(){const b=bands[$('#gelSample').value];$('#gelResult').innerHTML=`<b>${b.length} frammenti</b><div class="mini" style="margin-top:5px">Dimensioni dichiarate: ${b.join(', ')} bp</div>`;let shape=`<defs><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><rect x="0" y="0" width="560" height="270" rx="15" fill="#10192e"/><text x="160" y="25" font-size="12" fill="#dce9ff">Marker</text><text x="365" y="25" font-size="12" fill="#dce9ff">Campione</text><rect x="130" y="37" width="90" height="213" rx="5" fill="#18305c"/><rect x="334" y="37" width="90" height="213" rx="5" fill="#18305c"/><path d="M129 43h92M333 43h92" stroke="#9baed2" stroke-width="4"/>`;const pos=bp=>Math.min(232,55+(Math.log10(3000)-Math.log10(Math.max(100,bp)))*120);for(const bp of [2400,1500,1000,600,300,150])shape+=`<rect x="138" y="${pos(bp)}" width="74" height="5" rx="3" fill="#85e4e6" opacity=".76"/>`;for(const bp of [...new Set(b)])shape+=`<rect x="342" y="${pos(bp)}" width="74" height="6" rx="3" fill="#c0ecb9" opacity="${b.filter(x=>x===bp).length>1?1:.8}"/>`;$('#gelDrawing').innerHTML=svg(shape,560,270)}
function scanCRISPR(){let str=$('#crisprSeq').value.toUpperCase().replace(/\s/g,'');const out=$('#crisprResult');if(str.length<25||str.length>220||!/^[ACGT]+$/.test(str)){out.innerHTML='<div class="empty">Inserisci da 25 a 220 basi usando solo A, C, G e T.</div>';return}const hits=[];for(let i=0;i<=str.length-3;i++)if(str[i+1]==='G'&&str[i+2]==='G')hits.push({pos:i+1,motif:str.slice(i,i+3),upstream:str.slice(Math.max(0,i-20),i)});out.innerHTML=`<div class="formula"><b>${hits.length} potenziali PAM NGG</b></div>${hits.length?`<ul class="resultlist">${hits.slice(0,15).map(x=>`<li><b>Posizione ${x.pos}</b> · PAM <b>${h(x.motif)}</b><br><span class="mini">20 nt a monte: ${h(x.upstream)||'—'}</span></li>`).join('')}</ul>${hits.length>15?'<p class="mini">Mostrati i primi 15 risultati.</p>':''}`:'<p>Nessun motivo NGG trovato sulla catena fornita.</p>'}<p class="mini">Ricerca su un solo filamento, in orientamento 5′→3′. Non include verifica del filamento opposto né analisi off-target.</p>`}
function updatePlasmid(){const host=$('#plHost').value,prom=$('#plProm').value,gene=$('#plGene').value,ok=host===prom;$('#plResult').innerHTML=ok?`<b style="color:var(--teal)">✓ Scelta coerente</b><div class="mini">Il promotore selezionato è adatto in linea generale all'ospite.</div>`:`<b style="color:var(--rose)">⚠ Possibile incompatibilità</b><div class="mini">Un promotore di un altro sistema non garantisce l'espressione.</div>`;let inner=`<circle cx="292" cy="132" r="86" fill="none" stroke="#438afa" stroke-width="24" stroke-dasharray="185 380"/><circle cx="292" cy="132" r="86" fill="none" stroke="#16ab9d" stroke-width="24" stroke-dasharray="130 430" stroke-dashoffset="-192"/><circle cx="292" cy="132" r="86" fill="none" stroke="#e69b34" stroke-width="24" stroke-dasharray="190 370" stroke-dashoffset="-327"/><text x="292" y="125" fill="currentColor" text-anchor="middle" font-size="20" font-weight="800">PLASMIDE</text><text x="292" y="148" fill="currentColor" text-anchor="middle" font-size="12">vettore circolare</text><rect x="14" y="24" width="14" height="14" rx="3" fill="#438afa"/><text x="35" y="36" fill="currentColor" font-size="13">Promotore</text><rect x="14" y="48" width="14" height="14" rx="3" fill="#16ab9d"/><text x="35" y="60" fill="currentColor" font-size="13">Transgene</text><rect x="14" y="72" width="14" height="14" rx="3" fill="#e69b34"/><text x="35" y="84" fill="currentColor" font-size="13">Origine / selezione</text>`;$('#plDrawing').innerHTML=svg(inner,590,270)}
function updatePGX(){const vals=[$('#pgxA').value,$('#pgxB').value],no=vals.filter(v=>v==='2').length,hi=vals.filter(v=>v==='17').length;let label=no===2?'Attività molto ridotta (esempio)':no===1?'Attività ridotta (esempio)':hi>=1?'Attività potenzialmente aumentata (esempio)':'Attività di riferimento (esempio)';$('#pgxResult').innerHTML=`<b>${label}</b><div class="mini" style="margin-top:5px">Genotipo illustrativo: *${vals[0]} / *${vals[1]}</div>`;let value=no===2?10:no===1?42:hi>=1?84:64;$('#pgxDrawing').innerHTML=svg(`<text x="30" y="40" fill="currentColor" font-size="17" font-weight="800">Attività schematica</text><rect x="30" y="95" width="525" height="34" rx="16" fill="#d5deea"/><rect x="30" y="95" width="${525*value/100}" height="34" rx="16" fill="#438afa"/><text x="30" y="161" fill="currentColor" font-size="13">Non rappresenta una misura clinica né una scala di dose.</text>`,590,230)}
function quizUI(){if(!quizSession)return `${head('ALLENAMENTO','Verifica ciò che sai.','Scegli quanti quesiti affrontare e su quale modulo. Le spiegazioni compaiono dopo ogni risposta.')}<div class="panel quiz-box"><div class="grid grid-2" style="margin-bottom:17px"><div><label for="quizTopic" style="display:block;font-weight:800;margin-bottom:7px">Argomento</label><select id="quizTopic" class="field"><option value="all">Tutti i moduli</option>${C.map(c=>`<option value="${h(c.id)}">${h(c.title)}</option>`).join('')}</select></div><div><label for="quizCount" style="display:block;font-weight:800;margin-bottom:7px">Numero di domande</label><select id="quizCount" class="field"><option value="5">5 domande</option><option value="10" selected>10 domande</option><option value="20">20 domande</option><option value="all">Tutte le disponibili</option></select></div></div><button class="btn" data-action="startquiz">Inizia il quiz →</button></div>`;if(quizSession.end)return `${head('RISULTATI','Quiz completato 🎉','Hai finito la sessione. Il risultato è salvato tra le tue statistiche.')}<div class="panel quiz-box"><div class="number">${quizSession.score} / ${quizSession.list.length}</div><div class="progressbar" style="margin:14px 0 21px"><div style="width:${100*quizSession.score/quizSession.list.length}%"></div></div><p>${quizSession.score===quizSession.list.length?'Ottimo: tutte corrette!':'Ripassa gli errori nelle spiegazioni e riprova.'}</p><div class="btnrow"><button class="btn" data-action="resetquiz">Nuovo quiz</button><button class="btn secondary" data-page="cards">Ripassa con le flashcard</button></div></div>`;return `<div class="quiz-box"><div class="quiz-head"><div><span class="eyebrow">QUIZ IN CORSO</span><h2>Domanda <span id="quizN">1</span> di ${quizSession.list.length}</h2></div><button class="btn secondary small" data-action="exitquiz">Esci</button></div><div class="progressbar" style="margin-bottom:18px"><div id="quizProgress"></div></div><div class="panel"><div class="tiny" id="quizCategory"></div><h3 class="quiz-question" id="quizQuestion"></h3><div id="quizChoices"></div><div id="quizFeedback" aria-live="polite"></div></div></div>`}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(topic,count){const pool=Q.filter(q=>topic==='all'||q.ch===topic),n=count==='all'?pool.length:Math.min(+count,pool.length);quizSession={list:shuffled(pool).slice(0,n),i:0,score:0,choice:null,end:false};go('quiz')}
function paintQuiz(){const s=quizSession,q=s.list[s.i];if(!q)return;$('#quizN').textContent=s.i+1;$('#quizProgress').style.width=(100*(s.i+1)/s.list.length)+'%';$('#quizCategory').textContent=C.find(c=>c.id===q.ch)?.title||'Biologia';$('#quizQuestion').textContent=q.question;$('#quizChoices').innerHTML=q.options.map((opt,i)=>`<button class="quiz-choice ${s.choice!==null?(i===q.correct?'good':i===s.choice?'bad':''):''}" data-choice="${i}" ${s.choice!==null?'disabled':''}><span class="tiny" style="margin-right:9px">${String.fromCharCode(65+i)}.</span>${h(opt)} ${s.choice!==null&&i===q.correct?'✓':''}</button>`).join('');$('#quizFeedback').innerHTML=s.choice===null?'':`<div class="quiz-feedback"><b>${s.choice===q.correct?'✓ Corretto!':'✗ Risposta da rivedere'}</b><p>${h(q.why)}</p><button class="btn" style="margin-top:10px" data-action="nextquiz">${s.i===s.list.length-1?'Mostra risultato':'Prossima domanda →'}</button></div>`}
function chooseQuiz(i){const s=quizSession;if(!s||s.choice!==null)return;const q=s.list[s.i];s.choice=i;if(i===q.correct){s.score++;store.correct++}store.answered++;save();paintQuiz()}
function nextQuiz(){const s=quizSession;if(!s||s.choice===null)return;if(s.i===s.list.length-1){s.end=true;render();return}s.i++;s.choice=null;paintQuiz()}
function cardsDeck(){return F.map((x,i)=>({...x,index:i})).filter(f=>(cardTopic==='all'||f.ch===cardTopic)&&(!cardOnlyReview||store.review[f.index]==='review'))}
function cardsUI(){return `${head('RIPASSO ATTIVO','Una carta alla volta.','Prova a rispondere prima di girare la carta. Segna quelle difficili per ritrovarle.')}<div class="panel" style="max-width:820px"><div class="filters" style="margin-bottom:7px"><select id="cardTopic" class="field" aria-label="Argomento flashcard"><option value="all">Tutti gli argomenti</option>${C.map(c=>`<option value="${h(c.id)}" ${cardTopic===c.id?'selected':''}>${h(c.title)}</option>`).join('')}</select><label style="display:flex;align-items:center;gap:9px;color:var(--sub);font-size:13px;font-weight:700;padding-left:5px"><input type="checkbox" id="onlyReview" ${cardOnlyReview?'checked':''}> Solo da ripassare</label></div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 0"><span class="tiny" id="cardCounter"></span><button class="textbtn" data-action="shufflecards">Mescola ↝</button></div><button class="flashcard" id="flipCard" data-action="flipcard" aria-label="Gira flashcard"><small id="cardFace">DOMANDA</small><strong id="cardContent">—</strong><span class="tiny">Tocca per girare la carta</span></button><div class="flash-actions"><button class="btn secondary" data-action="prevcard">← Indietro</button><button class="btn secondary" data-action="flipcard">Gira carta</button><button class="btn" data-action="nextcard">Avanti →</button></div><div class="flash-actions" style="margin-top:12px"><button class="btn small soft" data-action="markcard" data-mark="review">↻ Da ripassare</button><button class="btn small positive" data-action="markcard" data-mark="known">✓ La so</button></div></div>`}
function paintCard(){const deck=cardsDeck();if(!deck.length){$('#cardCounter').textContent='Nessuna carta';$('#cardContent').textContent='Nessuna carta in questa selezione.';$('#cardFace').textContent='TUTTO FATTO';$$('[data-action="markcard"], [data-action="nextcard"], [data-action="prevcard"]').forEach(b=>b.disabled=true);return}cardIndex=(cardIndex%deck.length+deck.length)%deck.length;const card=deck[cardIndex];$('#cardCounter').textContent=`${cardIndex+1} di ${deck.length}`;$('#cardFace').textContent=cardFlipped?'RISPOSTA':'DOMANDA';$('#cardContent').textContent=cardFlipped?card.back:card.front;$$('[data-action="markcard"], [data-action="nextcard"], [data-action="prevcard"]').forEach(b=>b.disabled=false)}
function cardMove(n){const len=cardsDeck().length;if(!len)return;cardIndex=(cardIndex+n+len)%len;cardFlipped=false;paintCard()}
function markCard(mark){const deck=cardsDeck();if(!deck.length)return;const current=deck[cardIndex];store.review[current.index]=mark;save();if(cardOnlyReview){const remaining=cardsDeck();if(remaining.length)cardIndex%=remaining.length;else cardIndex=0}else cardIndex=(cardIndex+1)%deck.length;cardFlipped=false;paintCard()}
function glossUI(){const entries=Object.entries(G).filter(([term,def])=>`${term} ${def}`.toLocaleLowerCase('it').includes(glossFilter.toLocaleLowerCase('it'))).sort((a,b)=>a[0].localeCompare(b[0],'it'));return `${head('GLOSSARIO','Le parole chiave.','Le definizioni in breve, pronte da cercare durante il ripasso.')}<input id="glossSearch" class="field" type="search" placeholder="Cerca un termine…" aria-label="Cerca nel glossario" value="${h(glossFilter)}" style="margin-bottom:17px"><p class="tiny">${entries.length} termini</p><div class="gloss-grid" id="glossGrid">${entries.map(([term,def])=>`<article class="panel"><h3>${h(term)}</h3><p>${h(def)}</p></article>`).join('')}</div>`}
function aboutUI(){return `${head('INFORMAZIONI','Un laboratorio pensato per studiare.','Una raccolta indipendente di strumenti didattici: chiara, consultabile da telefono e utilizzabile senza account.')}<div class="panel about-content"><h2>Come funziona</h2><p>Usa <b>Moduli</b> per leggere, <b>Laboratori</b> per esplorare modelli, <b>Quiz</b> per verificarti e <b>Flashcard</b> per ripassare. Puoi segnare una lezione come completata, impostare le carte difficili e cercare definizioni nel glossario.</p><h2 style="margin-top:27px">Contenuti e limiti</h2><p>Il materiale riprende temi di biologia molecolare, DNA ricombinante e farmacogenomica utili per lo studio universitario in Farmacia. <b>Non è una risorsa ufficiale dell’Università degli Studi di Brescia</b> né sostituisce il programma aggiornato e le lezioni dei docenti. I laboratori sono simulazioni illustrative, non strumenti clinici o protocolli sperimentali.</p><h2 style="margin-top:27px">Salvataggio</h2><p>I progressi restano nel browser di questo dispositivo. Se cancelli i dati del sito potresti perderli; puoi esportarli e ripristinarli con un file JSON.</p><div class="settings-actions"><button class="btn secondary" data-action="export">Esporta progressi</button><label class="btn secondary" style="cursor:pointer">Importa progressi<input id="importData" type="file" accept="application/json" hidden></label><button class="btn secondary" data-action="resetprogress">Azzera progressi</button></div><div class="alert" style="margin-top:25px"><b>Fonti per approfondire:</b> manuali universitari di biologia molecolare e genetica, NCBI Bookshelf e documentazione di corsi e insegnamenti pubblicata dall’ateneo. Per obiettivi e programma d’esame, consulta sempre le schede ufficiali UniBS dell’anno accademico di riferimento.</div><p class="tiny" style="margin-top:17px">MOLECOLA LAB · versione 3 · Interfaccia ricostruita per iPhone, tablet e computer.</p></div>`}
let toastTimer;function toast(message){const t=$('#toast');t.textContent=message;t.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hide'),2600)}
function downloadProgress(){const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='molecola-progressi.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function rerenderLessons(){if(page!=='lessons')return;const el=$('#lessonSearch');if(el)lessonFilter=el.value;const cat=$('#lessonCategory');if(cat)lessonCategory=cat.value;const match=C.filter(c=>(lessonCategory==='Tutte'||c.category===lessonCategory)&&(!lessonFilter||[c.title,c.category,c.lead,...c.sections.map(s=>s.body)].join(' ').toLocaleLowerCase('it').includes(lessonFilter.toLocaleLowerCase('it'))));$('#lessonCount').textContent=`${match.length} moduli trovati`;$('#lessonGrid').innerHTML=match.length?match.map(card).join(''):'<div class="empty">Nessun risultato. Prova un’altra parola.</div>'}
function rerenderGlossary(){if(page!=='glossary')return;glossFilter=$('#glossSearch').value;const items=Object.entries(G).filter(([key,value])=>(key+' '+value).toLocaleLowerCase('it').includes(glossFilter.toLocaleLowerCase('it'))).sort((a,b)=>a[0].localeCompare(b[0],'it'));$('#glossGrid').innerHTML=items.length?items.map(([key,value])=>`<article class="panel"><h3>${h(key)}</h3><p>${h(value)}</p></article>`).join(''):'<div class="empty">Nessun termine trovato.</div>'}
document.addEventListener('click',e=>{const navTarget=e.target.closest('[data-page]');if(navTarget){go(navTarget.dataset.page);return}const lab=e.target.closest('[data-lab]');if(lab){activeLab=lab.dataset.lab;go('labs');return}const choice=e.target.closest('[data-choice]');if(choice){chooseQuiz(+choice.dataset.choice);return}const phase=e.target.closest('[data-phase]');if(phase){phasePCR(+phase.dataset.phase);return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;if(a==='theme'){store.theme=store.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=store.theme;save();nav()}else if(a==='complete'){const id=btn.dataset.id;store.done[id]=!store.done[id];save();render();toast(store.done[id]?'Lezione completata!':'Lezione rimessa tra quelle da fare')}else if(a==='chapterquiz')startQuiz(btn.dataset.id,'all');else if(a==='startquiz')startQuiz($('#quizTopic').value,$('#quizCount').value);else if(a==='exitquiz'){quizSession=null;render()}else if(a==='nextquiz')nextQuiz();else if(a==='resetquiz'){quizSession=null;render()}else if(a==='flipcard'){cardFlipped=!cardFlipped;paintCard()}else if(a==='nextcard')cardMove(1);else if(a==='prevcard')cardMove(-1);else if(a==='markcard')markCard(btn.dataset.mark);else if(a==='shufflecards'){const deck=cardsDeck();cardIndex=deck.length?Math.floor(Math.random()*deck.length):0;cardFlipped=false;paintCard()}else if(a==='scancrispr')scanCRISPR();else if(a==='export')downloadProgress();else if(a==='resetprogress'){if(confirm('Vuoi davvero azzerare tutte le lezioni completate, le statistiche e le flashcard?')){store.done={};store.review={};store.answered=0;store.correct=0;store.lastLesson=null;save();render();toast('Progressi azzerati')}}});
document.addEventListener('keydown',e=>{const el=e.target.closest('[role="button"][data-page]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();go(el.dataset.page)}});
document.addEventListener('input',e=>{const id=e.target.id;if(id==='lessonSearch')rerenderLessons();else if(id==='glossSearch')rerenderGlossary();else if(id==='pcrCycles'||id==='pcrEff')updatePCR();else if(id==='qA'||id==='qB')updateQPCR();else if(id==='crisprSeq'){} });
document.addEventListener('change',e=>{const id=e.target.id;if(id==='lessonCategory')rerenderLessons();else if(id==='gelSample')updateGel();else if(id==='plHost'||id==='plProm'||id==='plGene')updatePlasmid();else if(id==='pgxA'||id==='pgxB')updatePGX();else if(id==='cardTopic'){cardTopic=e.target.value;cardIndex=0;cardFlipped=false;paintCard()}else if(id==='onlyReview'){cardOnlyReview=e.target.checked;cardIndex=0;cardFlipped=false;paintCard()}else if(id==='importData'){const file=e.target.files?.[0];if(!file)return;file.text().then(t=>{try{const obj=JSON.parse(t);if(typeof obj!=='object'||!obj.done||!obj.review)throw new Error('File non valido');store={...store,...obj};save();render();toast('Progressi importati')}catch{toast('Impossibile leggere il file dei progressi')}})}});
render();
</script>
</body>
