return `${header('SIMULAZIONE',`Quiz <span class="accent">ragionato.</span>`,'Rispondi, poi leggi perché le alternative non spiegano il meccanismo nel contesto proposto.')}<div class="card"><div class="flex-between"><strong id="quizCounter">Domanda 1</strong><span class="badge mint" id="quizScore">0 corrette</span></div><div class="progress"><span id="quizBar" style="width:0%"></span></div><div id="quizQuestion"></div><div id="quizFeedback"></div><div class="buttons" style="margin-top:17px"><button class="primary" id="quizNext" data-action="nextQuiz" style="display:none">Prossima domanda →</button><button class="secondary" data-action="endQuiz">Termina test</button></div></div>`}
function shuffle(arr){return [...arr].map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}
function startQuiz(topic='all',count=10){const pool=Q.filter(x=>topic==='all'||x.ch===topic);const n=count==='all'?pool.length:Math.min(+count,pool.length);quizSession={list:shuffle(pool).slice(0,n),index:0,score:0,choice:null,log:[],finished:false};go('quiz')}
function showQuestion(){if(!quizSession||quizSession.finished)return;const i=quizSession.index,q=quizSession.list[i];if(!q)return;$('#quizCounter').textContent=`Domanda ${i+1} di ${quizSession.list.length}`;$('#quizScore').textContent=`${quizSession.score} corrette`;$('#quizBar').style.width=100*i/quizSession.list.length+'%';$('#quizQuestion').innerHTML=`<div class="tiny" style="margin:25px 0 8px">${escapeHTML(CH.find(c=>c.id===q.ch)?.title||q.ch).toUpperCase()}</div><div class="question">${escapeHTML(q.question)}</div><div style="margin-top:20px">${q.options.map((a,j)=>`<button class="option" data-answer="${j}"><b style="color:var(--blue)">${'ABCD'[j]}.</b> ${escapeHTML(a)}</button>`).join('')}</div>`;$('#quizFeedback').innerHTML='';$('#quizNext').style.display='none'}
function chooseQuiz(i){if(!quizSession||quizSession.choice!==null)return;const s=quizSession,q=s.list[s.index];s.choice=i;const correct=i===q.correct;s.score+=correct?1:0;s.log.push({choice:i});state.answered=(state.answered||0)+1;state.correct=(state.correct||0)+(correct?1:0);save();$$('[data-answer]').forEach((el,j)=>{el.disabled=true;if(j===q.correct)el.classList.add('correct');if(j===i&&!correct)el.classList.add('wrong')});$('#quizFeedback').innerHTML=`<div class="quiz-feedback"><strong style="color:${correct?'var(--mint)':'var(--pink)'}">${correct?'✓ Corretto':'✗ Risposta da rivedere'}</strong><p>${escapeHTML(q.why)}</p></div>`;$('#quizScore').textContent=`${s.score} corrette`;$('#quizNext').style.display='inline-block';$('#quizNext').textContent=s.index===s.list.length-1?'Vedi risultati →':'Prossima domanda →';$('#quizBar').style.width=100*(s.index+1)/s.list.length+'%'}

function updatePGX(){
  if(!$('#pgxA'))return;
  const a=$('#pgxA').value,b=$('#pgxB').value, pair=[a,b];
  const n0=pair.filter(x=>x==='2').length, n17=pair.filter(x=>x==='17').length;
  let phenotype,score;
  if(n0===2){phenotype='Metabolizzatore lento (PM)';score=8}
  else if(n0===1){phenotype='Metabolizzatore intermedio (IM)';score=38}
  else if(n17===2){phenotype='Metabolizzatore ultrarapido (UM)';score=100}
  else if(n17===1){phenotype='Metabolizzatore rapido (RM)';score=80}
  else{phenotype='Metabolizzatore normale (NM)';score=63}
  // Queste barre non sono attività enzimatiche misurate o una scala quantitativa.
  const x=score*4.9;
  $('#pgxVis').innerHTML=svgEl(`<text x="35" y="35" fill="#acbdd4" font-size="15">Attività concettuale, scala arbitraria</text><rect x="38" y="75" width="520" height="38" rx="13" fill="#2c4262"/><rect x="38" y="75" width="${x}" height="38" rx="13" fill="#baf39b"/><text x="38" y="161" fill="#edf4ff" font-size="18">CYP2C19 *${a} / *${b}</text><text x="38" y="194" fill="#acbdd4" font-size="13">Visualizzazione illustrativa — non interpretabile clinicamente</text>`);
  $('#pgxOut').innerHTML=`<div class="label">FENOTIPO STIMATO NEL MODELLO</div><b>${phenotype}</b><p>Il clopidogrel è un profarmaco: una ridotta attività CYP2C19 può ridurne la bioattivazione. Il rapporto fra genotipo e risposta reale dipende anche dal contesto clinico e da altri fattori. Nessuna indicazione di dose o scelta di farmaco.</p>`;
}
