<script>
const DATA={"chapters":[{"id":"membrane","icon":"🫧","title":"Membrane e trasporto","category":"Biologia cellulare","minutes":22,"level":"Base","lead":"La membrana non è soltanto una barriera: determina accesso, distribuzione ed eliminazione di molti farmaci.","objectives":["Distinguere diffusione passiva, trasporto facilitato e attivo","Collegare permeabilità, ionizzazione e trasportatori all’ADME","Interpretare il ruolo dei sistemi in vitro"],"sections":[{"title":"Bilayer, gradiente e permeabilità","body":"Il doppio strato fosfolipidico presenta un nucleo idrofobico: molecole piccole e non cariche attraversano spesso più facilmente rispetto a specie polari o ionizzate. La velocità dipende anche da area, spessore, gradiente e coefficienti di ripartizione. Non significa che tutte le molecole lipofile attraversino sempre efficacemente ogni membrana."},{"title":"Diffusione, canali e carrier","body":"La diffusione semplice segue il gradiente senza carrier. La diffusione facilitata usa proteine, è saturabile e non richiede direttamente energia per muovere il soluto lungo il gradiente. Il trasporto attivo diretto (es. ATPasi) o secondario può spostare sostanze contro gradiente grazie a una fonte di energia."},{"title":"Farmaci e trasportatori","body":"P-glicoproteina (ABCB1) è un trasportatore di efflusso ATP-dipendente: può ridurre l’accumulo intracellulare di alcuni substrati. Trasportatori SLC e ABC influenzano farmacocinetica e interazioni. Modelli di permeabilità come Caco-2 sono utili, ma non replicano completamente una barriera fisiologica."},{"title":"Come si misura","body":"Esperimenti con traccianti, trasporto bidirezionale e inibitori permettono di distinguere fenomeni passivi da trasporto mediato. Importante controllare integrità del monostrato, vitalità cellulare e concentrazione del substrato."}],"clinic":"Una molecola attraversa bene un monostrato solo da un lato: l’asimmetria può suggerire un trasportatore di efflusso, non soltanto permeabilità intrinseca.","pitfall":"«Lipofilo = sempre biodisponibile» è falso: solubilità, metabolismo e trasporto di efflusso contano.","summary":"Gradiente → barriera → proteine di trasporto → concentrazione del farmaco nel sito bersaglio."},{"id":"vescicole","icon":"📦","title":"Traffico vescicolare","category":"Biologia cellulare","minutes":20,"level":"Base","lead":"Il sistema endomembranoso smista proteine, recettori e materiali: un errore di indirizzamento può alterare la risposta ai farmaci.","objectives":["Confrontare COPII, COPI e clatrina","Spiegare segnale di smistamento e fusione","Seguire il percorso di una proteina secretoria"],"sections":[{"title":"Dall’ER al Golgi","body":"Le proteine destinate alla via secretoria entrano nel reticolo endoplasmatico; COPII partecipa al traffico anterogrado verso il Golgi, mentre COPI contribuisce al traffico retrogrado e al riciclo di componenti."},{"title":"Endocitosi e clatrina","body":"La clatrina forma un rivestimento che favorisce curvatura e gemmazione della vescicola. L’endocitosi mediata da recettore consente l’internalizzazione selettiva di ligandi. Le vescicole rivestite poi perdono il coat prima della fusione."},{"title":"Rab, SNARE e destinazione","body":"Piccole GTPasi Rab contribuiscono al targeting; le proteine SNARE aiutano ad avvicinare le membrane per la fusione. Sequenze o modificazioni di sorting possono dirigere il carico a endosomi, lisosomi o membrana."},{"title":"Riciclo e degradazione","body":"Dopo internalizzazione, un recettore può tornare in membrana oppure essere indirizzato ai lisosomi. Questa scelta può regolare durata e intensità di un segnale farmacologico."}],"clinic":"Un farmaco biologico legato a un recettore internalizzante può essere veicolato in compartimenti endosomiali; l’efficacia dipende anche dal traffico intracellulare.","pitfall":"COPII non è un sinonimo di trasporto dal Golgi all’ER: quella direzione è soprattutto associata a COPI.","summary":"Coat seleziona/gemma, Rab indirizza, SNARE fonde; il destino finale modifica la risposta cellulare."},{"id":"segnale","icon":"🕸️","title":"Comunicazione e pathway","category":"Segnalazione","minutes":28,"level":"Intermedio","lead":"Molti farmaci agiscono su recettori o su nodi delle cascate intracellulari, non direttamente sul DNA.","objectives":["Distinguere recettori di membrana e intracellulari","Ricostruire GPCR e recettori tirosin-chinasici","Riconoscere feedback, cross-talk e nodi terapeutici"],"sections":[{"title":"GPCR e secondi messaggeri","body":"Il ligando stabilizza conformazioni del recettore accoppiato a proteine G. Gs può aumentare il cAMP via adenilato ciclasi; Gi può ridurlo; Gq può attivare PLCβ con IP3 e DAG. La risposta dipende dal contesto e dal tipo cellulare."},{"title":"RTK, MAPK e PI3K","body":"I recettori tirosin-chinasici, dopo attivazione, avviano reti che includono RAS–RAF–MEK–ERK e PI3K–AKT–mTOR. Le vie regolano crescita, sopravvivenza e metabolismo; alterazioni persistenti possono contribuire a malattia."},{"title":"Wnt, Notch, Hedgehog, NF-κB","body":"Wnt/β-catenina influenza trascrizione e destino cellulare; Notch richiede contatto cellula-cellula e proteolisi regolata; Hedgehog governa programmi di sviluppo; NF-κB regola risposte infiammatorie e di sopravvivenza."},{"title":"Recettori intracellulari","body":"Ligandi sufficientemente permeabili possono legare recettori nucleari che agiscono da fattori trascrizionali. Le risposte genomiche hanno spesso dinamiche più lente delle risposte ionotropiche."}],"clinic":"Un inibitore di MEK può ridurre l’output di ERK anche se il recettore a monte resta attivo; la rete può però adattarsi con feedback.","pitfall":"Il nome di una via non implica che tutti i suoi nodi siano sempre attivi insieme o producano lo stesso effetto in ogni tessuto.","summary":"Ligando → recettore → trasduttori → risposta; feedback e cross-talk determinano l’effetto osservato."},{"id":"genoma","icon":"🧬","title":"Genoma umano e varianti","category":"Genetica molecolare","minutes":24,"level":"Base","lead":"Un linguaggio corretto delle varianti evita di confondere mutazioni, polimorfismi e alterazioni strutturali.","objectives":["Leggere gene, esone, introne e regione regolatoria","Distinguere SNV, indel, CNV e varianti strutturali","Collegare genotipo e funzione senza automatismi"],"sections":[{"title":"Architettura del DNA","body":"Il genoma umano aploide di riferimento comprende circa 3,1 miliardi di coppie di basi nei cromosomi nucleari, con variazioni secondo l’assemblaggio e le regioni considerate. I geni codificanti proteine sono circa 20.000; solo una piccola frazione del genoma codifica proteine."},{"title":"Sequenze funzionali","body":"Oltre agli esoni codificanti esistono introni, UTR, promotori, enhancer, geni per RNA non codificanti e regioni ripetute. «Non codificante» non equivale a «senza funzione»."},{"title":"SNV, indel e CNV","body":"SNV indica differenza di una singola base; un SNP è una variante a singolo nucleotide comune secondo una soglia di frequenza convenzionale. Gli indel inseriscono o eliminano basi; le CNV modificano il numero di copie di una porzione genomica."},{"title":"Conseguenze e interpretazione","body":"Una variante può essere sinonima, missenso, nonsense, di splicing o regolatoria; l’effetto fenotipico dipende da contesto, penetranza, espressione e altre varianti. Associazione statistica non equivale a causalità."}],"clinic":"Una duplicazione genica può alterare quantità di enzima anche senza modificarne la sequenza amminoacidica.","pitfall":"«Mutazione» non implica sempre malattia; anche varianti comuni possono modificare una risposta farmacologica.","summary":"Tipo di variante → contesto genomico → effetto molecolare → fenotipo: ogni freccia richiede evidenze."},{"id":"epigenetica","icon":"🎛️","title":"Epigenetica e cromatina","category":"Genetica molecolare","minutes":26,"level":"Intermedio","lead":"L’identità cellulare e la risposta ai farmaci dipendono da come il genoma viene utilizzato, non soltanto dalla sua sequenza.","objectives":["Distinguere metilazione DNA e modificazioni istoniche","Conoscere i limiti delle analogie «acceso/spento»","Spiegare il ruolo dei miRNA nel controllo post-trascrizionale"],"sections":[{"title":"Metilazione del DNA","body":"Nei mammiferi la metilazione interessa spesso citosine in CpG. L’ipermetilazione di alcuni promotori può associarsi a repressione, ma l’effetto cambia con il contesto genomico; la metilazione del corpo genico non segue regole semplici."},{"title":"Istoni e accessibilità","body":"I nucleosomi impacchettano DNA attorno a un ottamero istonico. L’acetilazione di alcune lisine tende ad associarsi a cromatina accessibile; le metilazioni istoniche possono attivare o reprimere a seconda del residuo (es. H3K4me3 e H3K27me3)."},{"title":"Misurare il paesaggio epigenetico","body":"Bisolfito-sequenziamento e metodiche affini possono interrogare metilazione; ChIP-seq mappa regioni associate a proteine/modificazioni; ATAC-seq misura accessibilità. Ogni tecnica risponde a una domanda diversa."},{"title":"miRNA e altri ncRNA","body":"Un miRNA maturo guida il complesso RISC su mRNA parzialmente complementari e può ridurne stabilità o traduzione. La regolazione è di rete: un miRNA può avere più bersagli e viceversa."}],"clinic":"Un gene con promotore ipermetilato può mostrare minore trascrizione; ciò non dimostra, da solo, che la metilazione sia la causa del silenziamento.","pitfall":"«Acetilazione = sempre on» e «metilazione = sempre off» sono scorciatoie troppo semplici.","summary":"Sequenza invariata; accessibilità, modificazioni e RNA regolatori cambiano probabilità e livello d’espressione."},{"id":"riparo","icon":"🛠️","title":"Riparo e ricombinazione","category":"Genetica molecolare","minutes":28,"level":"Intermedio","lead":"Il tipo di lesione orienta il sistema di riparo e influenza stabilità genomica, sensibilità ai farmaci e risposta all’editing.","objectives":["Differenziare BER, NER, MMR e riparo delle rotture doppio filamento","Confrontare HR e NHEJ","Comprendere perché lo stato del ciclo cellulare conta"],"sections":[{"title":"Danni e singole basi","body":"BER rimuove basi alterate e ripara piccole lesioni; NER elimina un tratto di DNA che contiene lesioni ingombranti, come alcuni danni da UV; MMR corregge mismatch e piccoli loop sfuggiti alla replicazione."},{"title":"Rotture a doppio filamento","body":"NHEJ salda le estremità senza richiedere un lungo stampo omologo e può introdurre piccoli indel. HR usa una sequenza omologa come guida, particolarmente disponibile dopo la replicazione del DNA."},{"title":"Checkpoint e farmaci","body":"ATM/ATR e vie di checkpoint possono rallentare il ciclo in risposta a danno. Difetti in componenti HR possono creare vulnerabilità specifiche sfruttate da terapie oncologiche, ma il quadro clinico è complesso."},{"title":"Ricombinazione e trasposizione","body":"La ricombinazione omologa scambia informazioni tra molecole correlate; ricombinasi sito-specifiche agiscono su siti dedicati; i trasposoni si mobilizzano mediante meccanismi propri."}],"clinic":"Una cellula con HR compromessa può dipendere maggiormente da vie alternative; il concetto di letalità sintetica è alla base di alcune strategie terapeutiche.","pitfall":"CRISPR non «decide» da solo il risultato: spesso l’esito è determinato dalla via cellulare che ripara il taglio.","summary":"Lesione corretta + contesto cellulare → selezione della via di riparo → fedeltà o alterazione della sequenza."},{"id":"ricombinante","icon":"🧪","title":"DNA ricombinante e clonaggio","category":"Biotecnologie","minutes":30,"level":"Intermedio","lead":"Un gene diventa uno strumento sperimentale quando viene inserito e controllato dentro un sistema di espressione.","objectives":["Seguire taglio, assemblaggio, trasformazione e verifica","Distinguere vettore, inserto, promotore e marcatore","Spiegare perché sequenziare il costrutto finale"],"sections":[{"title":"Vettori e moduli","body":"Un plasmide di clonaggio contiene tipicamente origine di replicazione, elemento selettivo e sito d’inserimento. Per esprimere una proteina servono elementi regolatori compatibili con l’ospite, oltre alla sequenza codificante corretta."},{"title":"Restrizione e ligazione","body":"Molte endonucleasi riconoscono sequenze specifiche, spesso palindromiche. Possono generare estremità coesive o piatte; ligasi unisce estremità compatibili. Metodi alternativi di assemblaggio non dipendono necessariamente dai siti di restrizione."},{"title":"Trasformazione e screening","body":"Dopo ingresso del vettore nel sistema ospite, la selezione arricchisce cellule con il plasmide ma non garantisce da sola inserto corretto. PCR di colonia, digestione e sequenziamento possono verificare dimensione, orientamento e sequenza."},{"title":"Dal gene alla proteina","body":"Scelta di codoni, promotore, tag, localizzazione e sistema espressivo influisce sulla resa. Esprimere una proteina non garantisce corretta conformazione o glicosilazione."}],"clinic":"Per produrre una proteina terapeutica glicosilata, la scelta dell’ospite può essere importante quanto la sequenza del gene.","pitfall":"Colonia resistente ≠ plasmide ricombinante corretto. Serve verifica indipendente del costrutto.","summary":"Progettazione → assemblaggio → introduzione in ospite → verifica → espressione → qualità del prodotto."},{"id":"biologici","icon":"💉","title":"Biofarmaci e anticorpi","category":"Biotecnologie","minutes":28,"level":"Intermedio","lead":"Proteine ricombinanti e anticorpi monoclonali sono farmaci biologici: struttura e produzione sono parte della loro identità.","objectives":["Confrontare ospiti batterici e mammiferi","Comprendere anticorpi, frammenti e phage display","Collegare qualità di produzione e sicurezza"],"sections":[{"title":"Sistemi di espressione","body":"E. coli cresce rapidamente ma non replica molte modificazioni post-traduzionali umane. Lieviti e cellule mammifere, come CHO, consentono altre capacità biosintetiche. La piattaforma si sceglie in funzione del prodotto."},{"title":"Anticorpi e specificità","body":"Un anticorpo contiene regioni variabili che riconoscono epitopi e una porzione Fc che può interagire con recettori e complemento. Anticorpi interi, frammenti e formati bispecifici hanno proprietà distinte."},{"title":"Selezione e phage display","body":"Nel phage display varianti di frammenti proteici sono esposte su fagi. Cicli di binding, lavaggio e amplificazione arricchiscono leganti a un target; affinità e specificità vanno comunque misurate."},{"title":"Controllo qualità","body":"Glicosilazione, aggregazione, purezza, stabilità e immunogenicità potenziale sono parametri critici. Una sequenza identica non rende automaticamente due preparazioni biologiche equivalenti sotto ogni aspetto."}],"clinic":"Due linee cellulari possono produrre la stessa sequenza di anticorpo ma profili glicani differenti, con possibili effetti funzionali.","pitfall":"«Monoclonale» indica origine/specifità del prodotto, non assenza automatica di reazioni avverse.","summary":"Design molecolare + host + processo + controlli = proprietà del biofarmaco finito."},{"id":"pcr","icon":"⚡","title":"PCR, qPCR e sequenziamento","category":"Tecniche","minutes":32,"level":"Base","lead":"Le tecniche di amplificazione e lettura degli acidi nucleici hanno domande sperimentali e limiti differenti.","objectives":["Spiegare le tre fasi della PCR","Distinguere PCR endpoint, RT-PCR e qPCR","Confrontare Sanger e NGS"],"sections":[{"title":"Tre fasi della PCR","body":"Denaturazione separa i filamenti; annealing permette ai primer di appaiarsi; estensione sintetizza nuovo DNA 5′→3′. Temperature e tempi dipendono da primer, polimerasi e template: 95/55/72 °C sono esempi, non regole universali."},{"title":"Amplificazione reale vs ideale","body":"Con efficienza perfetta una molecola bersaglio diventa idealmente 2ⁿ copie dopo n cicli. Con efficienza E (0–1), il modello semplice diventa N=N₀(1+E)ⁿ; plateau, inibitori e consumi di reagenti limitano l’amplificazione reale."},{"title":"RT-PCR e qPCR","body":"La retrotrascrizione converte RNA in cDNA prima dell’amplificazione. qPCR monitora fluorescenza durante i cicli; un Ct più basso indica che una soglia è raggiunta prima, ma non consente confronti affidabili senza normalizzazioni e controlli."},{"title":"Sanger e NGS","body":"Il metodo Sanger sfrutta ddNTP che interrompono l’allungamento; NGS legge in parallelo molti frammenti. Profondità di copertura, errori, allineamento e qualità dell’analisi contano per interpretare varianti."}],"clinic":"Una qPCR mostra segnale più precoce in un campione: potrebbe avere più template iniziale, ma occorre verificare efficienza, normalizzazione e qualità.","pitfall":"PCR rileva una sequenza, non prova automaticamente presenza di organismo vitale o espressione proteica.","summary":"Domanda sperimentale → metodo → controlli → qualità dato → inferenza consentita."},{"id":"rna","icon":"🧷","title":"RNA terapeutici e aptameri","category":"Terapie innovative","minutes":30,"level":"Intermedio","lead":"Gli acidi nucleici possono essere non solo bersagli, ma anche strumenti terapeutici.","objectives":["Differenziare ASO, siRNA e miRNA","Descrivere i problemi di delivery","Comprendere il principio di SELEX"],"sections":[{"title":"Oligonucleotidi antisenso","body":"Gli ASO si appaiano a un RNA specifico e possono modulare splicing, bloccare interazioni o favorire degradazione via RNasi H, secondo chimica e progetto dell’oligonucleotide."},{"title":"siRNA e sistema RISC","body":"Il siRNA double-stranded entra nella via dell’interferenza a RNA: la guida dirige Argonaute verso RNA complementari, spesso causando clivaggio dell’mRNA. Un miRNA endogeno di norma si appaia in modo parziale e regola numerosi bersagli."},{"title":"Aptameri e SELEX","body":"Gli aptameri sono oligonucleotidi ripiegati che legano bersagli con specificità. SELEX seleziona iterativamente sequenze capaci di legare un target partendo da librerie molto ampie."},{"title":"Delivery e stabilità","body":"Nucleasi, assorbimento cellulare, distribuzione tissutale, immunostimolazione e off-target sono sfide. Modifiche chimiche e veicoli possono mitigare alcuni limiti, senza azzerarli."}],"clinic":"Un ASO può correggere un difetto di splicing senza alterare la sequenza del DNA genomico.","pitfall":"«RNA terapeutico» non significa necessariamente mRNA vaccinale: meccanismi e destinazioni sono molto diversi.","summary":"Sequenza complementare + chimica + delivery + compartimento cellulare → effetto terapeutico potenziale."},{"id":"crispr","icon":"✂️","title":"Genome editing e CRISPR","category":"Terapie innovative","minutes":34,"level":"Avanzato","lead":"CRISPR è una piattaforma di riconoscimento del DNA; l’esito cellulare dipende dal tipo di editor e dal riparo.","objectives":["Descrivere guida, target e PAM","Distinguere knockout, HDR e base/prime editing","Valutare off-target e controlli"],"sections":[{"title":"Targeting Cas9","body":"Nella forma SpCas9 classica, una guida RNA riconosce una sequenza vicina a un PAM 5′-NGG-3′ sul DNA. Il riconoscimento del PAM e la complementarità della guida concorrono alla specificità; il PAM non è parte della guida."},{"title":"Taglio e riparo","body":"SpCas9 può creare una rottura a doppio filamento. Il riparo NHEJ può produrre indel e inattivare un gene; fornire uno stampo non garantisce HDR. La frequenza dipende anche dal ciclo cellulare."},{"title":"Editor derivati","body":"Base editor e prime editor modificano la chimica o la sequenza del DNA senza richiedere necessariamente una doppia rottura classica; hanno comunque vincoli di targeting, prodotti indesiderati e controlli specifici."},{"title":"Sicurezza e validazione","body":"Off-target, grandi riarrangiamenti, mosaicismo, delivery e selezione clonale meritano attenzione. Sequenziamento del locus bersaglio da solo può non rilevare tutte le alterazioni possibili."}],"clinic":"Una cellula editata mostra assenza di proteina: servono test per distinguere indel desiderati, regolazione indiretta e altri effetti.","pitfall":"Trovare NGG in una sequenza non basta a progettare una guida clinicamente utilizzabile; il simulatore è solo didattico.","summary":"PAM + guida → riconoscimento → attività enzimatica → riparo/edit → validazione molecolare e funzionale."},{"id":"genetherapy","icon":"🧫","title":"Terapia genica e CAR-T","category":"Terapie innovative","minutes":32,"level":"Avanzato","lead":"La terapia genica comprende approcci di addizione, modifica o regolazione: la modalità di somministrazione è cruciale.","objectives":["Distinguere ex vivo e in vivo","Conoscere in termini generali vettori virali e non virali","Descrivere i componenti di una CAR-T"],"sections":[{"title":"Ex vivo vs in vivo","body":"Nell’approccio ex vivo le cellule vengono prelevate, modificate e poi reintrodotte. Nell’approccio in vivo il materiale viene somministrato direttamente al paziente, con differenti problemi di targeting e distribuzione."},{"title":"Vettori e rischio","body":"AAV, lentivirus e sistemi non virali hanno capacità, tropismo, persistenza e profili di rischio differenti. L’integrazione nel genoma può permettere espressione stabile ma comporta considerazioni di sicurezza specifiche."},{"title":"Come funziona una CAR-T","body":"Una cellula T ingegnerizzata esprime un recettore chimerico che riconosce un antigene superficiale e trasduce segnali di attivazione. Il suo effetto dipende da bersaglio, microambiente e caratteristiche del prodotto."},{"title":"Valutazione clinica","body":"Tra i rischi delle CAR-T possono esserci sindrome da rilascio di citochine e tossicità neurologica; la gestione richiede strutture specializzate. Qui si studia il principio, non protocolli di trattamento."}],"clinic":"Una terapia può funzionare molto bene ex vivo perché le cellule vengono caratterizzate prima della somministrazione; ciò non la rende automaticamente adatta a ogni patologia.","pitfall":"Un vettore non coincide con la terapia: gene, bersaglio, dose, cellule e controlli definiscono il prodotto.","summary":"Strategia → vettore → tessuto/cellule → espressione → efficacia e sicurezza."},{"id":"farmacogenomica","icon":"🧩","title":"Farmacogenomica","category":"Farmacia personalizzata","minutes":32,"level":"Intermedio","lead":"Varianti genetiche possono modificare metabolismo, trasporto, bersagli o rischio di reazioni avverse, ma la prescrizione richiede linee guida e contesto clinico.","objectives":["Distinguere farmacocinetica e farmacodinamica genetica","Comprendere alleli funzionali e fenotipi metabolici","Usare con prudenza esempi clinici e linee guida"],"sections":[{"title":"Dalle varianti al fenotipo","body":"Per alcuni geni enzimatici, il diplotipo può contribuire a classificare il metabolismo come povero, intermedio, normale o ultrarapido. Le categorie e la loro interpretazione sono gene-specifiche e possono dipendere da CNV."},{"title":"Esempi utili","body":"CYP2C19 influenza l’attivazione di alcuni profarmaci; CYP2D6 metabolizza numerose molecole; TPMT e NUDT15 sono importanti nella tolleranza a tiopurine; alcuni alleli HLA sono associati a rischi immunologici con specifici farmaci."},{"title":"Non tutto è DNA","body":"Interazioni, età, funzione epatica/renale, infiammazione e aderenza modificano concentrazione ed effetto. Il concetto di fenoconversione descrive quando un inibitore può alterare il fenotipo metabolico osservato."},{"title":"Dalla ricerca al letto del paziente","body":"Associazione genotipo–risposta, validità analitica, utilità clinica e raccomandazioni aggiornate sono livelli distinti di evidenza. Le tabelle didattiche non sostituiscono CPIC/DPWG o giudizio medico."}],"clinic":"Un diplotipo con attività ridotta non determina da solo una dose universale: dipendono dal farmaco, dal contesto e da raccomandazioni validate.","pitfall":"«Gene presente» non equivale a test genetico predittivo utile: conta la variante specifica e la qualità dell’evidenza.","summary":"Variante → enzima/bersaglio → esposizione/risposta → evidenza clinica → eventuale azione guidata."},{"id":"laboratorio","icon":"🔎","title":"Metodi e controlli di laboratorio","category":"Tecniche","minutes":26,"level":"Base","lead":"Le conclusioni sperimentali si costruiscono con controlli appropriati e conoscenza dei limiti strumentali.","objectives":["Associare tecnica e domanda","Distinguere controllo positivo/negativo e biologico/tecnico","Interpretare un risultato senza sovrainferenza"],"sections":[{"title":"Western blot ed ELISA","body":"Western blot separa proteine per dimensione apparente e usa anticorpi per rilevarle; ELISA quantifica o rileva analiti mediante riconoscimento e segnale enzimatico. La specificità anticorpale è un fattore critico."},{"title":"Citofluorimetria e microscopia","body":"Citofluorimetria misura proprietà di singole cellule in sospensione; immunofluorescenza conserva il contesto spaziale; FISH usa sonde nucleiche per riconoscere sequenze in cellule/tessuti."},{"title":"Misure di espressione","body":"RNA-seq o qPCR valutano RNA, Western/ELISA valutano proteina, saggi funzionali valutano attività. I tre livelli possono divergere a causa di regolazione post-trascrizionale o post-traduzionale."},{"title":"Controlli e replicati","body":"Controllo negativo identifica fondo/contaminazione; controllo positivo verifica che il saggio possa rilevare il target; repliche tecniche stimano variabilità del metodo, repliche biologiche quella tra campioni."}],"clinic":"Un Western blot mostra più proteina ma l’attività farmacologica non aumenta: la proteina potrebbe essere inattiva o mal localizzata.","pitfall":"«p < 0,05» non dimostra da solo rilevanza biologica, causalità o correttezza del disegno.","summary":"Domanda → controllo → misura → incertezza → interpretazione che non supera i dati."},{"id":"transgenici","icon":"🐭","title":"Transgenesi e pharming","category":"Biotecnologie","minutes":21,"level":"Intermedio","lead":"Organismi e sistemi modello permettono di studiare funzioni geniche e, in alcuni casi, produrre molecole biologiche.","objectives":["Distinguere transgenico, knockout e knock-in","Capire vantaggi e limiti dei modelli","Definire pharming"],"sections":[{"title":"Modelli genetici","body":"Un organismo transgenico porta materiale genetico introdotto tramite ingegneria. Knockout indica inattivazione di un gene; knock-in inserimento o sostituzione mirata. I metodi e l’assetto genomico concreto possono differire."},{"title":"Modello non è paziente","body":"Topo, organoide e coltura cellulare illuminano meccanismi ma non riproducono automaticamente l’intera farmacologia umana. Differenze di espressione e fisiologia possono modificare gli esiti."},{"title":"Pharming","body":"Il termine indica l’uso di sistemi biologici ingegnerizzati, anche piante o animali, per produrre molecole d’interesse farmaceutico. Contenimento, qualità, purificazione e biosicurezza sono aspetti essenziali."}],"clinic":"Un modello knockout può indicare il ruolo di un bersaglio, ma può innescare compensazioni durante lo sviluppo.","pitfall":"«Funziona nel topo» non equivale a «funziona nell’uomo».","summary":"Manipolazione genetica + modello biologico → ipotesi sperimentale, da validare in sistemi indipendenti."},{"id":"selex","icon":"🧲","title":"Aptameri, selezione e targeting","category":"Terapie innovative","minutes":19,"level":"Intermedio","lead":"Un ligando sintetico può riconoscere un bersaglio anche senza essere un anticorpo proteico.","objectives":["Spiegare il ciclo SELEX","Distinguere affinità, specificità e funzionalità","Conoscere limiti in vivo"],"sections":[{"title":"Come funziona SELEX","body":"Si parte da una libreria molto vasta di sequenze di DNA/RNA casualizzate. Incubazione con bersaglio, separazione del legante, amplificazione e cicli successivi arricchiscono le molecole che si legano meglio nelle condizioni impostate."},{"title":"Affinità contro specificità","body":"Un aptamero può mostrare Kd bassa verso un target pur legando anche altri bersagli. Controselezione e saggi ortogonali aiutano a esaminare la specificità."},{"title":"Formulazione e impieghi","body":"Nucleasi, filtrazione renale, struttura e delivery influenzano comportamento in vivo. Gli aptameri possono essere sonde analitiche, ligandi di targeting o, in casi selezionati, terapeutici."}],"clinic":"Se un aptamero lega molto bene una proteina purificata, il legame su cellule vive deve ancora essere dimostrato.","pitfall":"Arricchimento in selezione non equivale automaticamente a efficacia terapeutica.","summary":"Libreria → selezione iterativa → caratterizzazione → validazione nel contesto reale."}],"quiz":[{"ch":"membrane","question":"Quale trasporto può essere saturabile ma non usa direttamente ATP per il flusso lungo gradiente?","options":["Diffusione semplice","Diffusione facilitata","Osmosi attraverso il doppio strato","Diffusione gassosa"],"correct":1,"why":"Un carrier facilita il flusso lungo gradiente ed è saturabile; non è di per sé una pompa ATP-dipendente."},{"ch":"membrane","question":"Una forte asimmetria del trasporto attraverso Caco-2 può suggerire…","options":["Trasporto attivo/efflusso","Assenza di proteine di membrana","DNA mutato","Sempre un artefatto"],"correct":0,"why":"I trasportatori possono produrre differenze direzionali; i controlli devono però escludere artefatti."},{"ch":"membrane","question":"P-glicoproteina ABCB1 è…","options":["Un recettore nucleare","Un enzima della PCR","Un trasportatore di efflusso ATP-dipendente","Un istone"],"correct":2,"why":"ABCB1 può esportare substrati e influenzare la concentrazione del farmaco."},{"ch":"vescicole","question":"Quale coat è maggiormente associato all’uscita dal reticolo endoplasmatico?","options":["COPII","COPI","Clatrina soltanto","SNARE"],"correct":0,"why":"COPII è tipicamente coinvolto nel flusso anterogrado ER→Golgi."},{"ch":"vescicole","question":"Quale famiglia aiuta direttamente la fusione di membrane?","options":["SNARE","Topoisomerasi","Istoni","Telomerasi"],"correct":0,"why":"Le proteine SNARE formano complessi che favoriscono la fusione."},{"ch":"vescicole","question":"Dopo endocitosi un recettore può…","options":["Essere sempre distrutto","Essere riciclato o degradato","Diventare DNA","Non cambiare posizione"],"correct":1,"why":"Sorting endosomiale e riciclo decidono il destino del recettore."},{"ch":"segnale","question":"Nella via Gs è frequente osservare…","options":["Riduzione diretta di cAMP","Aumento di cAMP","Taglio genomico","Produzione di anticorpi"],"correct":1,"why":"Gs tende ad attivare adenilato ciclasi aumentando cAMP in molti contesti."},{"ch":"segnale","question":"La sequenza RAS–RAF–MEK–ERK appartiene principalmente a…","options":["MAPK","NHEJ","SELEX","Splicing"],"correct":0,"why":"Si tratta di una cascata di fosforilazione della famiglia MAPK."},{"ch":"segnale","question":"Notch si distingue perché tipicamente richiede…","options":["Un ligando di cellule adiacenti","Un primer","Un PAM","Un plasmide"],"correct":0,"why":"Notch è spesso attivato da ligandi presentati da cellule vicine."},{"ch":"genoma","question":"Una CNV modifica principalmente…","options":["Il numero di copie di una regione","La temperatura di melting","Tutti i codoni","La metilazione direttamente"],"correct":0,"why":"CNV sta per Copy Number Variation."},{"ch":"genoma","question":"«Non codificante» significa sempre «inutile»?","options":["Sì","No","Solo nei batteri","Solo negli esoni"],"correct":1,"why":"Esistono regioni regolatorie e RNA non codificanti con funzioni essenziali."},{"ch":"genoma","question":"Un allele missenso produce…","options":["Una sostituzione amminoacidica possibile","Sempre stop prematuro","Sempre nessun effetto","Una duplicazione cromosomica"],"correct":0,"why":"La conseguenza codificante missenso è una variazione di amminoacido; l’effetto funzionale resta da dimostrare."},{"ch":"epigenetica","question":"L’acetilazione delle lisine istoniche è spesso associata a…","options":["Maggiore accessibilità","Rotture cromosomiche obbligatorie","Sostituzione di basi","Inibizione universale"],"correct":0,"why":"Spesso corrisponde a cromatina più aperta, ma dipende dal contesto."},{"ch":"epigenetica","question":"Per localizzare modificazioni istoniche specifiche può servire…","options":["ChIP-seq","PCR di colonia soltanto","ELISA plasmatico soltanto","SELEX"],"correct":0,"why":"ChIP-seq usa immunoprecipitazione della cromatina associata a sequenziamento."},{"ch":"epigenetica","question":"I miRNA di norma…","options":["Regolano RNA bersaglio tramite RISC","Tagliano DNA con PAM","Sono ribosomi","Agiscono solo su proteine extracellulari"],"correct":0,"why":"Guidano complessi effettori che possono ridurre traduzione e stabilità degli mRNA."},{"ch":"riparo","question":"Quale via è specializzata in lesioni ingombranti che distorcono il DNA?","options":["NER","Mitosi","SELEX","Traduzione"],"correct":0,"why":"Nucleotide excision repair rimuove segmenti di DNA contenenti lesioni voluminose."},{"ch":"riparo","question":"HR richiede tipicamente…","options":["Una sequenza omologa","ATP solo nel mezzo","Solo una primasi","Un anticorpo"],"correct":0,"why":"La ricombinazione omologa usa uno stampo correlato per ripristinare sequenza."},{"ch":"riparo","question":"Quale via può generare indel al sito di una rottura doppio filamento?","options":["NHEJ","Traduzione","Glicosilazione","Splicing"],"correct":0,"why":"La giunzione non omologa può riparare con piccole inserzioni o delezioni."},{"ch":"ricombinante","question":"La sola resistenza ad antibiotico dimostra un inserto corretto?","options":["Sì sempre","No","Solo con GFP","Solo se plasmide circolare"],"correct":1,"why":"Indica selezione del marcatore, non correttezza di inserto, orientamento o sequenza."},{"ch":"ricombinante","question":"Quale elemento favorisce il mantenimento del plasmide in un ospite compatibile?","options":["Origine di replicazione","ddNTP","PAM","snRNA"],"correct":0,"why":"L’origine di replicazione permette di replicare il plasmide nell’ospite appropriato."},{"ch":"ricombinante","question":"Per verificare definitivamente una regione clonata è utile…","options":["Sequenziamento del costrutto","Solo contare le colonie","Solo valutare colore della piastra","Misurare pH"],"correct":0,"why":"Il sequenziamento controlla la sequenza, inclusi errori inattesi."},{"ch":"biologici","question":"Quale sistema offre tipicamente capacità di glicosilazione mammifera?","options":["Cellule CHO","E. coli non ingegnerizzato","Un primer","Un virus batteriofago da solo"],"correct":0,"why":"Cellule di mammifero come CHO processano numerose modificazioni post-traduzionali."},{"ch":"biologici","question":"Il phage display serve a…","options":["Selezionare molecole leganti","Misurare Ct","Denaturare DNA","Bloccare trascrizione"],"correct":0,"why":"Espone varianti di proteine/peptidi e arricchisce i leganti in cicli di selezione."},{"ch":"biologici","question":"La sequenza primaria uguale garantisce biologici identici in ogni proprietà?","options":["Sì","No","Solo anticorpi","Solo ormoni"],"correct":1,"why":"Processo e modificazioni post-traduzionali contribuiscono alle proprietà finali."},{"ch":"pcr","question":"In PCR quale fase favorisce appaiamento dei primer?","options":["Denaturazione","Annealing","Lisi","Elettroforesi"],"correct":1,"why":"Durante annealing i primer si appaiano alle sequenze complementari."},{"ch":"pcr","question":"Con efficienza ideale e una singola copia iniziale, dopo 10 cicli teoricamente quante copie?","options":["10","100","1024","20"],"correct":2,"why":"Il modello ideale è 2^n: 2^10=1024."},{"ch":"pcr","question":"Che cosa distingue la RT-PCR dalla PCR su DNA?","options":["Una retrotrascrizione iniziale da RNA","Un passaggio di ligasi","Una sequenza PAM","Clonaggio obbligatorio"],"correct":0,"why":"La retrotrascrizione sintetizza cDNA usando RNA come stampo."},{"ch":"pcr","question":"Quale affermazione è corretta sul Ct?","options":["Un Ct più basso spesso implica più template iniziale a parità di altre condizioni","È sempre uguale tra campioni","Misura proteina","Non dipende dall’efficienza"],"correct":0,"why":"Serve confrontare condizioni normalizzate: Ct non è un numero assoluto universalmente comparabile."},{"ch":"rna","question":"Un ASO può essere progettato per…","options":["Modulare lo splicing","Inserire obbligatoriamente un plasmide","Produrre un anticorpo direttamente","Causare duplicazione cromosomica sempre"],"correct":0,"why":"Alcuni antisenso bloccano siti di splicing o fattori regolatori."},{"ch":"rna","question":"SELEX è una tecnica per…","options":["Arricchire aptameri con affinità verso un target","Amplificare proteine con Taq","Contare cromosomi","Misurare pH"],"correct":0,"why":"Cicli di selezione isolano molecole leganti da grandi librerie."},{"ch":"rna","question":"Che cosa costituisce una sfida per l’RNA terapeutico?","options":["Stabilità e delivery","Solo colore delle basi","Assenza totale di bersagli","Mancanza di complementarità in ogni caso"],"correct":0,"why":"Nucleasi, assorbimento cellulare e distribuzione condizionano l’efficacia."},{"ch":"crispr","question":"Per SpCas9 classica, qual è un PAM tipico sul DNA?","options":["NGG","AUG","UAA","AAA sempre"],"correct":0,"why":"SpCas9 riconosce spesso il motivo 5′-NGG-3′."},{"ch":"crispr","question":"NHEJ dopo taglio di Cas9 può produrre…","options":["Indel","Glicosilazione","Traduzione","Maturazione dell’RNA"],"correct":0,"why":"Piccole inserzioni/delezioni sono frequenti esiti del riparo NHEJ."},{"ch":"crispr","question":"Perché cercare PAM non basta per un esperimento reale?","options":["Occorrono valutazioni di specificità, contesto e sicurezza","Perché il PAM è sempre RNA","Perché Cas9 non usa RNA","Perché la guida può essere casuale"],"correct":0,"why":"Targeting valido non garantisce efficienza, specificità o sicurezza."},{"ch":"genetherapy","question":"Un intervento ex vivo prevede…","options":["Modifica di cellule al di fuori dell’organismo","Solo somministrazione di compresse","Sempre modifica di embrioni","Nessuna manipolazione di cellule"],"correct":0,"why":"Le cellule sono raccolte, modificate e successivamente reintrodotte."},{"ch":"genetherapy","question":"Una CAR-T esprime…","options":["Un recettore chimerico per un bersaglio","Una polimerasi Taq","Un plasmide che resta sempre extracellulare","Solo un microRNA"],"correct":0,"why":"La CAR permette riconoscimento antigenico e attivazione delle cellule T."},{"ch":"genetherapy","question":"Un rischio clinico noto delle CAR-T è…","options":["Sindrome da rilascio di citochine","Solo allergia ai pollini","Nessun rischio","Mancata traduzione in ogni caso"],"correct":0,"why":"Le CAR-T richiedono gestione specialistica di possibili tossicità sistemiche."},{"ch":"farmacogenomica","question":"TPMT e NUDT15 sono rilevanti per la tollerabilità di…","options":["Tiopurine","Tutti i vaccini","Tutti gli antiacidi","Ogni vitamina"],"correct":0,"why":"Varianti di TPMT/NUDT15 possono influenzare tossicità da tiopurine in contesti specifici."},{"ch":"farmacogenomica","question":"Quale elemento NON va ignorato nell’interpretazione del genotipo?","options":["Interazioni farmacologiche","Il colore del logo del laboratorio","Il nome del computer","Numero di browser aperti"],"correct":0,"why":"Gli inibitori o induttori possono alterare il fenotipo metabolico effettivo."},{"ch":"farmacogenomica","question":"La classificazione metabolica può dipendere da…","options":["Alleli e numero di copie","Solo gruppo sanguigno","Solo altezza","Sempre un singolo SNP"],"correct":0,"why":"In alcuni geni la combinazione di varianti e CNV concorre a definire il fenotipo."},{"ch":"laboratorio","question":"Cosa misura direttamente una qPCR su cDNA?","options":["Abbondanza relativa di RNA con opportuna strategia","Quantità di proteina","Attività enzimatica","Glicosilazione"],"correct":0,"why":"La qPCR dopo retrotrascrizione interroga trascritti; la proteina richiede altre tecniche."},{"ch":"laboratorio","question":"Una replica biologica rappresenta…","options":["Campioni biologici indipendenti","Riletture dello stesso pozzetto","Un secondo screenshot","Un altro grafico degli stessi dati"],"correct":0,"why":"Le repliche biologiche aiutano a stimare variabilità tra unità sperimentali."},{"ch":"laboratorio","question":"FISH usa…","options":["Sonde di acidi nucleici","Anticorpi come unico reagente","ATP sintasi","Ribosomi sintetici"],"correct":0,"why":"Ibridazione in situ fluorescente visualizza sequenze complementari."},{"ch":"transgenici","question":"Un modello knockout…","options":["Inattiva un gene","Aumenta sempre tutte le proteine","È sempre una copia di un paziente","Non usa genetica"],"correct":0,"why":"Knockout indica inattivazione di un gene, con modalità diverse."},{"ch":"transgenici","question":"Pharming indica…","options":["Produzione di molecole farmaceutiche tramite sistemi biologici ingegnerizzati","Farmacie online","Solo farming informatico","Unicamente PCR"],"correct":0,"why":"Sistemi transgenici possono essere usati come piattaforme produttive."},{"ch":"transgenici","question":"Quale limite esiste usando modelli animali?","options":["Differenze specie-specifiche","Nessuno","Uguale metabolismo in tutte le specie","Impossibilità di introdurre geni"],"correct":0,"why":"Meccanismi, farmacocinetica e fisiologia non si trasferiscono sempre."},{"ch":"selex","question":"Nel SELEX a cosa serve l’amplificazione tra cicli?","options":["Arricchire le sequenze recuperate","Misurare il peso del bersaglio","Nucleare una cellula","Allungare una proteina"],"correct":0,"why":"Le sequenze leganti vengono amplificate per il successivo ciclo selettivo."},{"ch":"selex","question":"Una bassa Kd, presa da sola, garantisce efficacia terapeutica?","options":["No","Sì","Solo in vitro","Solo nelle piante"],"correct":0,"why":"Servono specificità, accessibilità del bersaglio, stabilità e attività biologica."},{"ch":"selex","question":"La controselezione in SELEX può aiutare a…","options":["Ridurre legami indesiderati","Aumentare le mutazioni per errore","Cancellare RNA genomico","Produrre un anticorpo"],"correct":0,"why":"Eliminando sequenze che legano target non desiderati si può migliorare la specificità."},{"ch":"membrane","question":"Che cosa rende diverso un canale da un carrier?","options":["Un canale forma un passaggio per il soluto","Un canale sintetizza DNA","Un carrier è sempre nucleare","Un canale ha sempre trasporto contro gradiente"],"correct":0,"why":"I canali formano pori selettivi; i carrier cambiano conformazione legando il soluto."},{"ch":"vescicole","question":"Quale organello riceve tipicamente proteine dalla via secretoria?","options":["Apparato di Golgi","Nucleolo","Mitocondrio senza translocasi","Centromero"],"correct":0,"why":"La via secretoria collega reticolo endoplasmatico e Golgi."},{"ch":"segnale","question":"Una via può cambiare risposta nonostante lo stesso agonista a causa di…","options":["Espressione di recettori e feedback","Colore del cromosoma","Assenza di cellule","Sempre la sequenza dei primer"],"correct":0,"why":"Diversi livelli di recettori e trasduttori producono output differenti."},{"ch":"genoma","question":"Una variante in un enhancer può potenzialmente alterare…","options":["Il livello di trascrizione","Solo il numero di ribosomi di E. coli","La misura del tampone","Tutte le proteine allo stesso modo"],"correct":0,"why":"Regioni regolatorie possono influire sull’espressione anche senza alterare codoni."},{"ch":"epigenetica","question":"Che cosa analizza ATAC-seq principalmente?","options":["Accessibilità cromatinica","Affinità di anticorpi terapeutici","Misure di temperatura PCR","Dimensione del vettore plasmidico"],"correct":0,"why":"ATAC-seq usa una trasposasi per interrogare regioni accessibili della cromatina."},{"ch":"riparo","question":"Un mismatch dopo replicazione è un substrato tipico di…","options":["MMR","SELEX","RT-PCR","Citometria"],"correct":0,"why":"MMR corregge errori di appaiamento sfuggiti alla polimerasi."},{"ch":"ricombinante","question":"Un promotore per cellule di mammifero garantisce espressione in E. coli?","options":["No","Sì in ogni caso","Solo con ddNTP","Solo in assenza di DNA"],"correct":0,"why":"Le macchine trascrizionali e gli elementi regolatori sono ospite-specifici."},{"ch":"biologici","question":"Che cos’è un epitopo?","options":["Porzione del bersaglio riconosciuta dall’anticorpo","Un vettore virale","Il primer di una PCR","Un frammento di gel"],"correct":0,"why":"Gli epitopi costituiscono regioni antigeniche riconosciute dai paratopi."},{"ch":"pcr","question":"Perché una PCR può entrare in plateau?","options":["Limiti di reagenti e accumulo di prodotti/inibitori","Perché le basi scompaiono","Perché il DNA diventa RNA","Perché la polimerasi è sempre assente"],"correct":0,"why":"Il modello esponenziale ideale non è valido indefinitamente."},{"ch":"rna","question":"Un miRNA può avere più RNA bersaglio?","options":["Sì","Mai","Solo se diventa DNA","Solo con Cas9"],"correct":0,"why":"I miRNA riconoscono spesso motivi corti presenti in più trascritti."},{"ch":"crispr","question":"Il PAM fa parte della sequenza della guida RNA?","options":["No, è sul DNA bersaglio","Sì, è sempre in guida","Solo nel nucleo batterico","È una proteina"],"correct":0,"why":"Il PAM è riconosciuto sul DNA da Cas9, mentre la guida contiene il tratto complementare al protospacer."},{"ch":"genetherapy","question":"Quale caratteristica può distinguere lentivirus e AAV?","options":["Pattern di integrazione e persistenza","Il fatto che soltanto uno trasporti nucleotidi","L’uso necessario di clatrina","La capacità di moltiplicare Ct"],"correct":0,"why":"Le piattaforme differiscono per biologia, capacità e rischi; la scelta non è intercambiabile."},{"ch":"farmacogenomica","question":"Farmacogenetica e farmacogenomica indicano sempre la stessa scala di analisi?","options":["No, spesso farmacogenomica considera più ampiamente varianti e profili","Sì, senza distinzioni possibili","Nessuna studia la risposta ai farmaci","Sono entrambe tecniche di microscopia"],"correct":0,"why":"I termini si sovrappongono, ma farmacogenomica è spesso usata per approcci più ampi o su scala genomica."},{"ch":"laboratorio","question":"Qual è un controllo negativo utile in PCR?","options":["Reazione senza stampo","Reazione con target certo","Concentrazione più alta di bersaglio","Un’altra polimerasi senza controlli"],"correct":0,"why":"Il no-template control aiuta a individuare contaminazione dei reagenti."},{"ch":"transgenici","question":"Qual è un limite di un knockout costituzionale?","options":["Compensazione durante lo sviluppo","Perfetta specificità di ogni farmaco","Nessuna differenza di specie","Obbligatoria assenza di fenotipo"],"correct":0,"why":"La perdita del gene fin dall’inizio può avviare meccanismi compensatori."},{"ch":"selex","question":"Un aptamero è necessariamente una proteina?","options":["No, in genere è DNA o RNA","Sì, sempre","Solo se prodotto da CHO","Solo se è un anticorpo"],"correct":0,"why":"Gli aptameri nucleici sono oligonucleotidi che assumono strutture capaci di legare bersagli."}],"flashcards":[{"ch":"membrane","front":"Che cosa vuol dire trasporto saturabile?","back":"Che i siti del carrier possono essere occupati: aumentando il substrato il flusso non cresce indefinitamente."},{"ch":"membrane","front":"Che cos’è ABCB1?","back":"Un trasportatore ATP-dipendente di efflusso, noto anche come P-glicoproteina."},{"ch":"membrane","front":"Un fattore oltre alla lipofilia che influenza biodisponibilità?","back":"Solubilità, ionizzazione, metabolismo o trasportatori."},{"ch":"vescicole","front":"COPI vs COPII?","back":"COPI: soprattutto retrogrado Golgi→ER. COPII: soprattutto anterogrado ER→Golgi."},{"ch":"vescicole","front":"A cosa servono le SNARE?","back":"Favoriscono la fusione tra membrane vescicolari e target."},{"ch":"vescicole","front":"Quale coat è tipico dell’endocitosi mediata da recettore?","back":"Clatrina."},{"ch":"segnale","front":"GPCR di tipo Gs: secondo messaggero?","back":"Spesso aumenta cAMP tramite adenilato ciclasi."},{"ch":"segnale","front":"Tre nodi a valle di RAS?","back":"RAF → MEK → ERK."},{"ch":"segnale","front":"Qual è una peculiarità di Notch?","back":"Attivazione tipicamente tramite contatto con una cellula vicina."},{"ch":"genoma","front":"SNV vs CNV?","back":"SNV: variazione di singola base; CNV: variazione del numero di copie di un segmento."},{"ch":"genoma","front":"Che cosa sono gli enhancer?","back":"Elementi regolatori che possono influenzare la trascrizione anche a distanza dal promotore."},{"ch":"genoma","front":"Un SNP è necessariamente patologico?","back":"No. È una variante comune di singolo nucleotide, non una diagnosi."},{"ch":"epigenetica","front":"Che cosa misura ATAC-seq?","back":"Accessibilità della cromatina, non direttamente la sequenza della metilazione."},{"ch":"epigenetica","front":"Che cosa fa un miRNA?","back":"Può ridurre stabilità o traduzione di RNA bersaglio tramite RISC."},{"ch":"epigenetica","front":"H3K27me3 è spesso associata a…","back":"Repressione trascrizionale nel contesto della cromatina."},{"ch":"riparo","front":"BER / NER / MMR in tre parole?","back":"Basi alterate / lesioni ingombranti / mismatch replicativi."},{"ch":"riparo","front":"Quale riparo usa stampo omologo?","back":"Ricombinazione omologa (HR)."},{"ch":"riparo","front":"Quale riparo è spesso associato a indel?","back":"NHEJ dopo rotture a doppio filamento."},{"ch":"ricombinante","front":"Tre componenti di un plasmide?","back":"Origine di replicazione, marcatore selettivo, sito di clonaggio; per esprimere serve anche promotore compatibile."},{"ch":"ricombinante","front":"Perché si sequenzia il costrutto finale?","back":"Per confermare inserto, orientamento e assenza di variazioni inattese."},{"ch":"ricombinante","front":"Che cosa fa la DNA ligasi?","back":"Unisce estremità di DNA formando legami fosfodiesterici."},{"ch":"biologici","front":"CHO significa?","back":"Chinese hamster ovary: linea cellulare mammifera usata nella produzione di molti biofarmaci."},{"ch":"biologici","front":"Che cosa seleziona il phage display?","back":"Leganti con le proprietà desiderate da librerie esposte su fagi."},{"ch":"biologici","front":"Perché le modificazioni post-traduzionali contano?","back":"Possono influire su attività, stabilità e comportamento delle proteine."},{"ch":"pcr","front":"Tre fasi della PCR?","back":"Denaturazione → annealing → estensione."},{"ch":"pcr","front":"Formula amplificazione ideale?","back":"N = N₀ × 2ⁿ, dove n è il numero di cicli."},{"ch":"pcr","front":"Che cosa sono ddNTP?","back":"Nucleotidi senza 3′-OH che interrompono l’estensione nel Sanger."},{"ch":"pcr","front":"RT-PCR: che cosa indica RT?","back":"Reverse transcription: da RNA a cDNA."},{"ch":"rna","front":"ASO: due possibili effetti?","back":"Modulare splicing oppure favorire degradazione di un RNA, a seconda del progetto."},{"ch":"rna","front":"Che cosa fa RISC?","back":"Guida interferenza/regolazione post-trascrizionale verso RNA bersaglio."},{"ch":"rna","front":"SELEX in una frase?","back":"Selezione iterativa di aptameri leganti da grandi librerie nucleotidiche."},{"ch":"crispr","front":"Che cos’è il PAM di SpCas9?","back":"Motivo di DNA vicino al target, tipicamente 5′-NGG-3′."},{"ch":"crispr","front":"Cas9 garantisce inserzione precisa?","back":"No: il riparo cellulare determina gli esiti; l’HDR non è garantita."},{"ch":"crispr","front":"Due rischi di genome editing?","back":"Off-target e alterazioni non volute al locus bersaglio, fra altri."},{"ch":"genetherapy","front":"Differenza ex vivo / in vivo?","back":"Fuori dal corpo con successiva reintroduzione / direttamente nell’organismo."},{"ch":"genetherapy","front":"Che cosa riconosce una CAR-T?","back":"Un antigene di superficie tramite il recettore chimerico."},{"ch":"genetherapy","front":"Un rischio CAR-T?","back":"Sindrome da rilascio di citochine; richiede supervisione specialistica."},{"ch":"farmacogenomica","front":"Che cos’è la fenoconversione?","back":"Alterazione del fenotipo metabolico osservato da fattori come interazioni farmacologiche."},{"ch":"farmacogenomica","front":"Due geni legati a tiopurine?","back":"TPMT e NUDT15, in contesti clinici specifici."},{"ch":"farmacogenomica","front":"Un gene che influenza attivazione di alcuni profarmaci?","back":"CYP2C19 è un esempio rilevante."},{"ch":"laboratorio","front":"RNA-seq vs Western blot?","back":"Misura trascritti RNA / rileva proteine tramite anticorpi."},{"ch":"laboratorio","front":"A cosa serve controllo positivo?","back":"Verifica che il test sia in grado di dare segnale atteso."},{"ch":"laboratorio","front":"A cosa serve FISH?","back":"Rileva sequenze nucleiche localizzate in cellule o tessuti."},{"ch":"transgenici","front":"Knock-in vs knockout?","back":"Inserimento/sostituzione mirata vs inattivazione di un gene."},{"ch":"transgenici","front":"Pharming è…","back":"Produzione di molecole di interesse farmaceutico in sistemi biologici ingegnerizzati."},{"ch":"transgenici","front":"Un limite modello animale?","back":"Differenze di fisiologia/metabolismo rispetto all’uomo."},{"ch":"selex","front":"Che cosa è un aptamero?","back":"DNA o RNA ripiegato che può legare specificamente un target."},{"ch":"selex","front":"Che cos’è la controselezione?","back":"Passaggio per rimuovere varianti che legano bersagli indesiderati."},{"ch":"selex","front":"Perché affinità ≠ efficacia?","back":"Mancano ancora dati su stabilità, biodisponibilità e funzione."},{"ch":"membrane","front":"Che cosa rappresenta un trasporto di efflusso?","back":"Il movimento di un substrato verso l’esterno mediato da trasportatori."},{"ch":"vescicole","front":"Rab vs SNARE?","back":"Rab aiuta a dirigere le vescicole; SNARE partecipa alla fusione delle membrane."},{"ch":"segnale","front":"Perché un inibitore a valle può funzionare anche con recettore attivo?","back":"Interrompe la trasduzione in un nodo successivo, salvo bypass e compensazioni."},{"ch":"genoma","front":"Esone significa sempre sequenza codificante?","back":"No, gli esoni possono includere anche regioni UTR non tradotte."},{"ch":"epigenetica","front":"Qual è un limite del modello acceso/spento?","back":"La regolazione trascrizionale è quantitativa e dipende da locus, cellula e contesto."},{"ch":"riparo","front":"Che riparo si usa per mismatch?","back":"MMR, mismatch repair."},{"ch":"ricombinante","front":"Che cosa significa un promotore compatibile?","back":"È riconosciuto dalla macchina trascrizionale dell’ospite nelle condizioni adatte."},{"ch":"biologici","front":"Che cos’è un epitopo?","back":"La regione dell’antigene riconosciuta da un anticorpo."},{"ch":"pcr","front":"Che cosa limita il raddoppio eterno nella PCR?","back":"Reagenti, plateau, inibitori, efficienza variabile e competizione con prodotti."},{"ch":"rna","front":"Differenza generale siRNA/miRNA?","back":"siRNA spesso complementarità elevata e clivaggio; miRNA tipicamente legami parziali e regolazione di rete."},{"ch":"crispr","front":"Il PAM si trova su RNA guida o sul DNA?","back":"Sul DNA vicino alla sequenza riconosciuta dalla guida."},{"ch":"genetherapy","front":"Perché distinguere ex vivo e in vivo?","back":"Cambiano controllo del prodotto, esposizione e difficoltà di delivery."},{"ch":"farmacogenomica","front":"Cosa serve oltre al genotipo per decidere una terapia?","back":"Evidenza clinica validata, linee guida aggiornate e contesto del paziente."},{"ch":"laboratorio","front":"Che cos’è un no-template control?","back":"Controllo PCR senza DNA stampo per intercettare contaminazioni."},{"ch":"transgenici","front":"Una cellula knockout può compensare la perdita di un gene?","back":"Sì, tramite cambiamenti di espressione e reti cellulari."},{"ch":"selex","front":"Aptamero vs anticorpo?","back":"Aptamero: oligonucleotide ripiegato; anticorpo: proteina immunoglobulinica."}],"glossary":{"ADME":"Assorbimento, Distribuzione, Metabolismo, Escrezione: fasi farmacocinetiche.","Annealing":"Fase PCR in cui i primer si appaiano alle sequenze complementari.","ASO":"Oligonucleotide antisenso: acido nucleico progettato per interagire con un RNA.","ATAC-seq":"Metodo per stimare accessibilità della cromatina mediante trasposasi e sequenziamento.","BER":"Base Excision Repair: ripara piccole alterazioni delle basi.","CAR-T":"Linfocita T ingegnerizzato con recettore antigenico chimerico.","ChIP-seq":"Immunoprecipitazione della cromatina associata a sequenziamento.","CHO":"Chinese Hamster Ovary: piattaforma cellulare per produrre proteine ricombinanti.","Clatrina":"Proteina di rivestimento coinvolta in alcune vie di formazione di vescicole.","CNV":"Copy Number Variation: differenza nel numero di copie di una regione del DNA.","COPI":"Coat vescicolare coinvolto soprattutto nel traffico retrogrado Golgi–ER.","COPII":"Coat vescicolare coinvolto soprattutto nel traffico ER–Golgi.","CpG":"Dinucleotide citosina-guanina sullo stesso filamento, sede comune di metilazione.","CRISPR":"Piattaforma derivata da sistemi procariotici di difesa per riconoscere/editare sequenze.","Ct / Cq":"Ciclo della qPCR in cui la fluorescenza supera la soglia scelta.","ddNTP":"Nucleotide senza 3′-OH, causa terminazione della catena nel sequenziamento Sanger.","Enhancer":"Regione regolatoria capace di aumentare la trascrizione in contesti adatti.","Esone":"Tratto di RNA primario mantenuto nel trascritto dopo splicing; non sempre codificante.","Glicosilazione":"Aggiunta enzimatica di strutture zuccherine a proteine o lipidi.","HDR":"Homology-directed repair: riparo che usa omologia come guida.","HR":"Homologous recombination: riparo/ricombinazione basata su sequenze omologhe.","Indel":"Inserzione o delezione di nucleotidi.","Introne":"Regione eliminata dal trascritto mediante splicing.","Kd":"Costante di dissociazione: a parità di modello, valori minori indicano maggiore affinità.","MAPK":"Mitogen Activated Protein Kinase: famiglia di chinasi delle vie di segnale.","miRNA":"Piccolo RNA regolatorio che può ridurre traduzione/stabilità degli mRNA bersaglio.","MMR":"Mismatch repair: riparo di appaiamenti errati, spesso post-replicativi.","NER":"Nucleotide Excision Repair: rimuove segmenti contenenti lesioni ingombranti.","NGS":"Next-generation sequencing: tecniche di sequenziamento massivamente parallelo.","NHEJ":"Non-homologous end joining: riunione di rotture a doppio filamento senza lungo stampo omologo.","Oligonucleotide":"Breve polimero di acidi nucleici di DNA o RNA.","PAM":"Protospacer adjacent motif: motivo del DNA riconosciuto da una determinata nucleasi CRISPR.","PCR":"Reazione a catena della polimerasi: amplifica regioni di DNA usando primer e cicli termici.","Phage display":"Tecnica di esposizione di varianti peptidiche/proteiche su fagi per selezionare leganti.","Pharming":"Produzione biotecnologica di molecole farmaceutiche tramite organismi ingegnerizzati.","Primer":"Breve oligonucleotide con 3′-OH disponibile per iniziare sintesi di DNA.","Promotore":"Sequenza regolatoria presso cui si avvia trascrizione.","qPCR":"PCR quantitativa/real-time: monitora l’amplificazione tramite fluorescenza.","RISC":"RNA-induced silencing complex: complesso effettore del silenziamento post-trascrizionale.","RT-PCR":"PCR preceduta da retrotrascrizione di RNA in DNA complementare.","SELEX":"Systematic Evolution of Ligands by Exponential Enrichment: selezione di aptameri.","siRNA":"Piccolo RNA interferente che guida il silenziamento di RNA bersaglio.","SNARE":"Proteine necessarie a molte fusioni di membrane intracellulari.","SNP":"Variante comune di singolo nucleotide, con soglia di frequenza convenzionale.","SNV":"Single Nucleotide Variant: variante di una singola base rispetto a un riferimento.","Trasduzione":"Introduzione di materiale genetico mediante vettore virale o propagazione di segnali, secondo il contesto.","Vettore":"Sistema di trasferimento o espressione di materiale genetico.","Western blot":"Metodo di rilevazione di proteine dopo separazione elettroforetica."}};
const CH=DATA.chapters, Q=DATA.quiz, FLASH=DATA.flashcards, GLOSS=DATA.glossary;
const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)];
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const groupBy=(a,fn)=>a.reduce((o,x)=>((o[fn(x)]??=[]).push(x),o),{});
const INITIAL={completed:{},review:{},answered:0,correct:0,streak:0,lastDay:'',theme:'dark',lastChapter:'',bookmarks:{}};
let state;try{state={...INITIAL,...JSON.parse(localStorage.getItem('molecola_lab_v2')||'{}')}}catch{state={...INITIAL}};
function save(){try{localStorage.setItem('molecola_lab_v2',JSON.stringify(state))}catch{}};
let page='home',quizSession=null,flashDeck=[],flashIndex=0,flashBack=false,searchText='',activeCategory='Tutti';
const labelFor=id=>({home:'Dashboard',chapters:'Moduli',labs:'Laboratorio',quiz:'Quiz',cards:'Flashcard',glossary:'Glossario',sources:'Fonti & guida',search:'Cerca'}[id]||CH.find(x=>x.id===id)?.title||id);
const categories=[...new Set(CH.map(x=>x.category))];
const countDone=()=>CH.filter(c=>state.completed[c.id]).length;
const numPct=()=>Math.round(100*countDone()/CH.length);
function iconFor(id){return ({home:'⌂',chapters:'▦',labs:'⚗',quiz:'✓',cards:'▣',glossary:'A',sources:'ⓘ'}[id]||'•')}
function navButton(id,emoji,name){let active=page===id|| (id==='chapters'&&CH.some(c=>c.id===page));return `<button class="navbtn ${active?'active':''}" data-page="${id}"><span class="emoji">${emoji}</span><span>${name}</span>${state.completed[id]?'<span class="tick">✓</span>':''}</button>`}
function drawNav(){const groups=groupBy(CH,c=>c.category);$('#sidebar-nav').innerHTML=`<div class="navlabel">Esplora</div>${navButton('home','⌂','Dashboard')}${navButton('chapters','▦','Tutti i moduli')}${navButton('labs','⚗','Laboratori interattivi')}${navButton('quiz','✍','Allenamento quiz')}${navButton('cards','▣','Flashcard')}${navButton('glossary','⌕','Glossario')}${navButton('sources','ⓘ','Programma e fonti')}<div class="navlabel">Capitoli · ${CH.length}</div>${Object.entries(groups).map(([name,cs])=>`<div class="navlabel">${escapeHTML(name)}</div>${cs.map(c=>`<button class="navbtn ${page===c.id?'active':''}" data-page="${c.id}"><span class="emoji">${c.icon}</span><span>${escapeHTML(c.title)}</span>${state.completed[c.id]?'<span class="tick">✓</span>':''}</button>`).join('')}`).join('')}`;
$('#side-done').textContent=`${countDone()}/${CH.length}`;$('#side-progress').style.width=numPct()+'%';
$('#mobile-nav').innerHTML=[['home','⌂','Home'],['chapters','▦','Moduli'],['labs','⚗','Lab'],['quiz','✓','Quiz'],['cards','▣','Cards']].map(([id,emoji,name])=>`<button class="${page===id||(id==='chapters'&&CH.some(c=>c.id===page))?'active':''}" data-page="${id}"><span class="ico">${emoji}</span>${name}</button>`).join('')}
function go(id,opts={}){if(!(['home','chapters','labs','quiz','cards','glossary','sources','search'].includes(id)||CH.some(c=>c.id===id)))id='home';page=id; if(CH.some(c=>c.id===id)){state.lastChapter=id;save()}render();if(!opts.noscroll)window.scrollTo({top:0,behavior:'instant'});try{history.replaceState(null,'',location.pathname+location.search+'#'+encodeURIComponent(id))}catch{}}
function render(){drawNav();$('#breadcrumb').textContent='MOLECOLA / '+labelFor(page).toUpperCase();const main=$('#main-content');main.innerHTML=page==='home'?renderHome():page==='chapters'?renderChapters():page==='labs'?renderLabs():page==='quiz'?renderQuiz():page==='cards'?renderCards():page==='glossary'?renderGlossary():page==='sources'?renderSources():page==='search'?renderSearch():renderChapter(CH.find(x=>x.id===page));if(page==='labs')updateAllLabs();if(page==='quiz')showQuestion();if(page==='cards')refreshFlash();}
function header(eyebrow,title,lead){return `<div class="eyebrow">${eyebrow}</div><h1 class="title">${title}</h1><p class="lead">${lead}</p>`}
function stat(v,label){return `<div class="stat"><b>${v}</b><span>${label}</span></div>`}
function chapterTile(c){const done=!!state.completed[c.id];return `<article class="card clickcard" data-page="${c.id}" role="button" tabindex="0"><div class="card-top"><span class="bigicon">${c.icon}</span><span class="badge ${done?'mint':''}">${done?'✓ Studiato':c.minutes+' min'}</span></div><div class="tiny">${escapeHTML(c.category)} · ${c.level}</div><h3 style="margin-top:9px">${escapeHTML(c.title)}</h3><p>${escapeHTML(c.lead)}</p><div class="flex-between"><span class="tiny">${c.sections.length} lezioni</span><span style="color:var(--mint)">Apri ↗</span></div></article>`}
function renderHome(){const last=CH.find(x=>x.id===state.lastChapter);const recommended=CH.filter(c=>!state.completed[c.id]).slice(0,3);return `<section class="hero"><div class="eyebrow">UNA SORPRESA PER UNO STUDENTE DI FARMACIA</div><h1 class="title">La biologia molecolare, <span class="accent">da toccare.</span></h1><p class="lead">Un atlante interattivo costruito intorno a <strong>Biologia molecolare applicata ai farmaci</strong> (3° anno, 6 CFU) con un ponte verso Farmacogenomica (3 CFU). Teoria ragionata, 8 laboratori, quiz, flashcard e ripasso.</p><div class="badges"><span class="badge mint">UniBS · Farmacia</span><span class="badge">Coorte 2024/25 · anno 2026/27</span><span class="badge">Funziona anche offline</span></div><div class="buttons"><button class="primary" data-page="${last&&!state.completed[last.id]?last.id:'chapters'}">${last&&!state.completed[last.id]?'Riprendi: '+escapeHTML(last.title):'Inizia a studiare'} →</button><button class="secondary" data-page="labs">Apri i laboratori ⚗</button></div></section><div class="meters">${stat(CH.length,'moduli teorici')}${stat(Q.length,'domande con spiegazione')}${stat(FLASH.length,'flashcard')}${stat(countDone()+'/'+CH.length,'capitoli completati')}</div><div class="section-head"><h2>Il percorso suggerito</h2><span class="tiny">Studia → sperimenta → verifica → ripassa</span></div><div class="grid">${(recommended.length?recommended:CH.slice(0,3)).map(chapterTile).join('')}</div><div class="section-head"><h2>Strumenti per prepararsi</h2></div><div class="grid"><div class="card clickcard" data-page="labs"><div class="bigicon">⚗</div><h3 style="margin-top:14px">Laboratorio virtuale</h3><p>Esplora amplificazione PCR, qPCR, editing CRISPR, cromatina, gel, clonaggio e segnalazione.</p><span style="color:var(--mint)">8 esperimenti →</span></div><div class="card clickcard" data-page="quiz"><div class="bigicon">✍</div><h3 style="margin-top:14px">Quiz ragionati</h3><p>Non solo risposte: dopo ogni scelta c'è la spiegazione del meccanismo.</p><span style="color:var(--mint)">Avvia test →</span></div><div class="card clickcard" data-page="cards"><div class="bigicon">▣</div><h3 style="margin-top:14px">Ripasso attivo</h3><p>Flashcard miste o per argomento con conteggio delle carte da rivedere.</p><span style="color:var(--mint)">Ripassa →</span></div></div><div class="callout warn"><strong>Allineamento al corso, senza fingere di avere il programma integrale</strong><p>La collocazione nel piano di studi, i CFU, il semestre e i docenti sono verificati su fonti UniBS. I temi di approfondimento sono una ricostruzione didattica indipendente, non una trascrizione del syllabus ufficiale né materiale approvato dall’Ateneo. Per confermare le parti d’esame, usa le lezioni e il syllabus del tuo anno.</p></div>`}
function filterChapters(){return CH.filter(c=>(activeCategory==='Tutti'||c.category===activeCategory)&&(!searchText||`${c.title} ${c.lead} ${c.category} ${c.sections.map(s=>s.body).join(' ')}`.toLowerCase().includes(searchText.toLowerCase())))}

function niceNum(x){if(!Number.isFinite(x))return '—';if(x>=1e10)return x.toExponential(2).replace('e+',' × 10^');return new Intl.NumberFormat('it-IT',{maximumFractionDigits:x<10?2:0}).format(x)}
function svgEl(inner,viewBox='0 0 620 230'){return `<svg viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${inner}</svg>`}
function baseGraph(){return `<line x1="46" y1="15" x2="46" y2="190" stroke="#647892" stroke-width="1"/><line x1="46" y1="190" x2="600" y2="190" stroke="#647892" stroke-width="1"/><text x="310" y="216" fill="#acbdd4" font-size="13">Cicli</text><text x="7" y="25" fill="#acbdd4" font-size="12">log₁₀</text>`}
function updatePCR(){if(!$('#pcrCycles'))return;const n=+$('#pcrCycles').value,e=+$('#pcrEff').value/100,n0=Math.min(1e6,Math.max(1,+$('#pcrStart').value||1));$('#v-pcrCycles').textContent=n;$('#v-pcrEff').textContent=Math.round(e*100)+'%';const count=n0*Math.pow(1+e,n);const maxlog=Math.log10(n0)+n*Math.log10(1+e);let points=[];for(let i=0;i<=n;i++){let y=Math.log10(n0)+i*Math.log10(1+e);points.push(`${46+554*i/Math.max(n,1)},${190-175*y/Math.max(1,maxlog)}`)}$('#pcrChart').innerHTML=svgEl(`${baseGraph()}<polyline points="${points.join(' ')}" stroke="#baf39b" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600" cy="15" r="5" fill="#baf39b"/><text x="50" y="20" fill="#baf39b" font-size="12">${escapeHTML(niceNum(count))} copie finali</text><text x="46" y="205" fill="#acbdd4" font-size="11">0</text><text x="583" y="205" fill="#acbdd4" font-size="11">${n}</text>`);$('#pcrOut').innerHTML=`<div class="label">STIMA TEORICA (${n} CICLI)</div><b>${niceNum(count)} copie</b><p>Modello N₀ × (1 + E)ⁿ, con N₀ = ${niceNum(n0)} ed E = ${Math.round(e*100)}%. Non considera il plateau finale.</p>`}
function phasePCR(phase){$$('[data-pcrphase]').forEach(b=>b.classList.toggle('active',+b.dataset.pcrphase===phase));const titles=['① Denaturazione','② Annealing','③ Estensione'];const desc=['Il DNA a doppio filamento si separa: lo stampo diventa accessibile.','I primer si appaiano alle sequenze bersaglio. La temperatura dipende da sequenza e buffer.','Una DNA polimerasi termostabile prolunga i primer in direzione 5′→3′.'];$('#pcrPhaseTitle').textContent=titles[phase];$('#pcrPhaseDesc').textContent=desc[phase]}
function updateQPCR(){if(!$('#qpcrA'))return;const A=+$('#qpcrA').value,B=+$('#qpcrB').value;$('#v-qpcrA').textContent=`10^${A}`;$('#v-qpcrB').textContent=`10^${B}`;const threshold=1e10,ct=x=>Math.log2(threshold/10**x);let lines=baseGraph();for(let j=0;j<=40;j+=10){const x=46+554*j/40;lines+=`<line x1="${x}" y1="20" x2="${x}" y2="190" stroke="#344862" stroke-dasharray="3 5"/><text x="${x}" y="205" fill="#acbdd4" font-size="11" text-anchor="middle">${j}</text>`}for(const [log,color] of [[A,'#baf39b'],[B,'#91c5ff']]){let pts=[];for(let i=0;i<=40;i++){const val=Math.min(10,log+i*Math.log10(2));pts.push(`${46+554*i/40},${190-170*val/10}`)}lines+=`<polyline points="${pts.join(' ')}" stroke="${color}" stroke-width="3" fill="none"/>`;}lines+=`<line x1="46" y1="20" x2="600" y2="20" stroke="#ffd491" stroke-dasharray="7 6"/><text x="390" y="17" fill="#ffd491" font-size="11">Soglia teorica</text>`;$('#qpcrChart').innerHTML=svgEl(lines);$('#qpcrOut').innerHTML=`<div class="label">Ct stimati, efficienza perfetta</div><b>A: ${ct(A).toFixed(1)} · B: ${ct(B).toFixed(1)}</b><p>Differenza ≈ ${Math.abs(ct(A)-ct(B)).toFixed(1)} cicli. Con efficienza perfetta, 1 ciclo corrisponde a un fattore 2 di quantità iniziale.</p>`}
function updateEPI(){if(!$('#epiAcetyl'))return;const ac=+$('#epiAcetyl').value,me=+$('#epiMethyl').value;$('#v-epiAcetyl').textContent=ac+'%';$('#v-epiMethyl').textContent=me+'%';const access=Math.round(Math.max(0,Math.min(100,35+0.5*ac-0.4*me)));let circles='';for(let i=0;i<6;i++){const spacing=access/10+24;const cx=65+i*spacing;circles+=`<ellipse cx="${cx}" cy="108" rx="15" ry="24" fill="#c8b6ff" opacity="${.4+.5*me/100}" stroke="#c8b6ff"/><path d="M${cx-18} 108 Q${cx} 85 ${cx+18} 108" fill="none" stroke="#91c5ff" stroke-width="3"/>`;}$('#epiChart').innerHTML=svgEl(`<path d="M 30 108 Q 310 ${95-access/5} 600 108" fill="none" stroke="#91c5ff" stroke-width="3"/>${circles}<text x="24" y="37" fill="#baf39b" font-size="15">Accessibilità relativa (indice): ${access}/100</text><rect x="24" y="173" width="570" height="15" rx="7" fill="#2d3f58"/><rect x="24" y="173" width="${5.7*access}" height="15" rx="7" fill="#baf39b"/>`);$('#epiOut').innerHTML=`<div class="label">STATO DIMOSTRATIVO</div><b>${access>=65?'Più accessibile':access<=35?'Meno accessibile':'Intermedio'}</b><p>Metilazione e acetilazione sono indici didattici indipendenti; una stessa modifica può avere effetti diversi per locus e contesto.</p>`}
const gelSamples={a:[1500,600,220],b:[1000,1000,300],c:[2400]};
function updateGel(){if(!$('#gelSample'))return;let bands=gelSamples[$('#gelSample').value],drawing=`<text x="42" y="23" fill="#acbdd4" font-size="12">Marker</text><text x="330" y="23" fill="#acbdd4" font-size="12">Campione</text><rect x="35" y="35" width="550" height="174" rx="9" fill="#101c32"/>`;const mapY=b=>58+135*(Math.log10(3000)-Math.log10(b))/(Math.log10(3000)-Math.log10(120));for(let [x,bs] of [[140,[3000,2000,1500,1000,500,250,120]],[400,bands]]){drawing+=`<rect x="${x-29}" y="44" width="58" height="12" rx="3" fill="#617795" opacity=".75"/>`;for(let b of [...new Set(bs)]){const y=mapY(b),opacity=bs.filter(v=>v===b).length===2?'.95':'.75';drawing+=`<rect x="${x-30}" y="${y}" width="60" height="5" rx="3" fill="${x===400?'#baf39b':'#91c5ff'}" opacity="${opacity}"/><text x="${x+38}" y="${y+6}" fill="#acbdd4" font-size="11">${b} bp</text>`}}drawing+=`<path d="M500 70 V175" stroke="#ffcf8e" stroke-width="2" stroke-dasharray="4 4"/><path d="M494 169 L500 179 L506 169" stroke="#ffcf8e" fill="none" stroke-width="2"/><text x="473" y="205" fill="#ffcf8e" font-size="10">Migrazione ↓</text>`;$('#gelChart').innerHTML=svgEl(drawing)}
function checkGel(){const answer=$('#gelAnswer').value;$('#gelOut').innerHTML=answer?`<b style="font-size:20px">${answer==='far'?'✓ Corretto!':'✗ Non esatto'}</b><p>Nel modello di elettroforesi su gel, a parità di condizioni, i frammenti più piccoli tendono a migrare più lontano. Due frammenti della stessa lunghezza possono sovrapporsi in una banda più intensa.</p>`:'<p>Prima scegli un’ipotesi dal menu.</p>'}
function updatePlasmid(){if(!$('#plHost'))return;const host=$('#plHost').value,prom=$('#plProm').value,product=$('#plProduct').value;const compat=(host==='ecoli'&&prom==='lac')||(host==='cho'&&prom==='cmv');const t7=prom==='t7';const glyco=product==='mab';let text=t7?'Il promotore T7 funziona soltanto in un sistema dotato di RNA polimerasi T7; qui non è specificato: compatibilità non garantita.':compat?'Il promotore scelto è di una classe comunemente usata per questo tipo di ospite.':'Il promotore selezionato non è normalmente compatibile con il sistema di espressione scelto.';if(glyco){text+=' Un anticorpo intero correttamente assemblato e glicosilato è in genere più adatto a un sistema di mammifero; contano anche vettori e catene pesante/leggera.'}else{text+=' La resa e la qualità dipendono comunque da folding, ottimizzazione e controlli.'}const good=compat&&(!glyco||host==='cho');let col=good?'#baf39b':'#ffd491';$('#plasmidChart').innerHTML=svgEl(`<circle cx="305" cy="118" r="70" fill="none" stroke="#91c5ff" stroke-width="22"/><path d="M305 48 A70 70 0 0 1 375 118" fill="none" stroke="#baf39b" stroke-width="22"/><path d="M375 118 A70 70 0 0 1 305 188" fill="none" stroke="#ffa9ca" stroke-width="22"/><text x="305" y="109" fill="#edf4ff" font-size="18" text-anchor="middle">Vettore</text><text x="305" y="128" fill="#acbdd4" font-size="12" text-anchor="middle">(schema)</text><text x="398" y="64" fill="#baf39b" font-size="12">Promotore</text><text x="399" y="170" fill="#ffa9ca" font-size="12">Inserto</text><text x="65" y="128" fill="#91c5ff" font-size="12">Backbone</text>`);$('#plasmidOut').innerHTML=`<div class="label">VALUTAZIONE DI COMPATIBILITÀ CONCETTUALE</div><b style="color:${col};font-size:22px">${good?'Scelta didatticamente coerente':'Criticità da valutare'}</b><p>${escapeHTML(text)}</p><p>La selezione non dimostra che il prodotto sia stato espresso o funzioni correttamente.</p>`}
const PAMDEFAULT='ATGCTAACGTTAGCGATCTGACCTGGATCGACTAGCATGGCTAACCGTTAACCGGTCGATCGTTACCTGAAGGATC';
function scanPam(){if(!$('#crisprSeq'))return;let s=$('#crisprSeq').value.toUpperCase().replace(/\s/g,'');const out=$('#crisprOut');if(!/^[ACGT]{25,150}$/.test(s)){out.textContent='Inserisci soltanto A/C/G/T, da 25 a 150 basi.';return;}let hits=[];for(let i=0;i<s.length-2;i++){if(s[i+1]==='G'&&s[i+2]==='G')hits.push(i);}let positions=new Set(hits.flatMap(i=>[i,i+1,i+2]));let marked=[...s].map((c,i)=>positions.has(i)?`<mark>${c}</mark>`:c).join('');out.innerHTML=`<div class="label">${hits.length} motivi 5′-NGG-3′ sul filamento mostrato</div><div>${marked}</div><div style="color:#acbdd4;font-size:12px;margin-top:12px">Posizioni iniziali (indice da 1): ${hits.map(i=>i+1).join(', ')||'nessuna'}</div><div style="font-family:ui-sans-serif,system-ui;letter-spacing:normal;color:#acbdd4;font-size:12px;margin-top:7px">I motivi evidenziati sono un primo filtro, non guide progettate.</div>`}
function updateSignal(){if(!$('#signalRec'))return;const on=$('#signalRec').value==='1',block=$('#signalBlock').value,nodes=['Recettore','Adenilato ciclasi','cAMP','PKA','Risposta'],s=[];let working=on;for(let i=0;i<nodes.length;i++){if((block==='receptor'&&i>=0)||(block==='adenyl'&&i>=1)||(block==='pka'&&i>=3))working=false;s.push(working)}let visual='';nodes.forEach((n,i)=>{const x=18+i*122;visual+=`<rect x="${x}" y="86" width="105" height="54" rx="12" fill="${s[i]?'#365d4a':'#344259'}" stroke="${s[i]?'#baf39b':'#647892'}"/><text x="${x+52}" y="117" text-anchor="middle" fill="#edf4ff" font-size="${n.length>15?10:12}">${n}</text>`;if(i<4)visual+=`<path d="M${x+106} 113 h14" stroke="#91c5ff" stroke-width="2"/><path d="M${x+116} 108 l6 5 l-6 5" fill="none" stroke="#91c5ff" stroke-width="2"/>`});visual+=`<text x="18" y="37" fill="#baf39b" font-size="15">${on?'Stimolo presente':'Stimolo assente'} — ${block==='none'?'nessun blocco':'blocco: '+block}</text>`;$('#signalChart').innerHTML=svgEl(visual);$('#signalOut').innerHTML=`<div class="label">OUTPUT DEL MODELLO</div><b style="font-size:24px">${s[4]?'Segnale trasmesso':'Segnale interrotto'}</b><p>${s[4]?'Nella catena semplificata tutti i nodi sono attivati.':'Il modello interrompe la trasmissione al nodo scelto o in assenza di stimolo.'} In cellule reali, vie parallele e retroazioni possono compensare o modificare l’effetto.</p>`}
