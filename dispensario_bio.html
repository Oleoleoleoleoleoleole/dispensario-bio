<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dispensario Interattivo: Genetica Molecolare & DNA Ricombinante</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--blue:#38bdf8;--green:#4ade80;--purple:#c084fc;--border:#334155}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font-family:Segoe UI,system-ui,sans-serif;display:flex;min-height:100vh}nav{width:320px;flex-shrink:0;background:#0b1120;border-right:1px solid var(--border)}nav h1{font-size:1.2rem;color:var(--blue);padding:20px;margin:0;border-bottom:1px solid var(--border);text-transform:uppercase}nav button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #1e293b;border-radius:0;background:transparent;color:#f8fafc;padding:18px 20px;cursor:pointer;font:inherit}nav button:hover,nav button.active{background:var(--card);color:var(--blue);border-left:4px solid var(--blue)}main{flex:1;padding:30px;min-width:0}h2{color:var(--blue);font-size:2rem;border-bottom:2px solid var(--border);padding-bottom:12px}article{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin:24px 0;box-shadow:0 4px 20px #0005}h3{color:var(--green);margin-top:0}p{color:#cbd5e1;line-height:1.65}.term{color:var(--purple);border-bottom:1px dashed;cursor:pointer;font-weight:600}.interactive{display:flex;flex-direction:column;align-items:center;gap:15px;background:#090d16;border:1px solid var(--border);padding:20px;border-radius:8px}canvas{background:#050811;border-radius:6px;max-width:100%;height:auto}.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.controls button{background:var(--blue);color:#0f172a;border:0;border-radius:6px;padding:10px 18px;font-weight:bold;cursor:pointer}.controls button:hover{background:#7dd3fc}.video{aspect-ratio:16/9;position:relative}.video iframe{position:absolute;width:100%;height:100%;border:0;border-radius:8px}#modal{display:none;position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px}#modal>div{background:var(--card);border:1px solid var(--purple);padding:30px;border-radius:12px;width:min(500px,100%);position:relative}#close{position:absolute;right:16px;top:10px;background:transparent;color:white;border:0;font-size:2rem;cursor:pointer}@media(max-width:700px){body{display:block}nav{width:100%;border-right:0}nav h1{padding:12px 16px}nav .links{display:flex;overflow-x:auto}nav button{white-space:nowrap;width:auto;padding:13px}main{padding:16px}h2{font-size:1.5rem}article{padding:16px}}
</style></head><body>
<nav><h1>Dispensario Bio</h1><div class="links"><button class="active" data-section="genoma">🧬 Architettura Genoma</button><button data-section="epigenetica">🔬 Epigenetica & RNA</button><button data-section="ricombinante">🧪 DNA Ricombinante</button><button data-section="pcr">⚡ PCR Interattiva</button></div></nav><main id="content"></main>
<div id="modal" role="dialog" aria-modal="true"><div><button id="close" aria-label="Chiudi">×</button><h3 id="modalTitle" style="color:var(--purple)"></h3><p id="modalText"></p></div></div>
<script>
const dictionary={SNV:"Single Nucleotide Variation: sostituzione di una singola base azotata nella sequenza del DNA. Se presente in oltre l'1% della popolazione, viene definita SNP (Polimorfismo a Singolo Nucleotide).",CNV:"Copy Number Variation: variazioni nel numero di copie di un determinato segmento di DNA (da 50 bp fino a diverse megabasi), che influiscono sul dosaggio genico.",eucromatina:"La forma generalmente decondensata e accessibile della cromatina, spesso associata ad attività trascrizionale.",miRNA:"MicroRNA: piccole molecole di RNA non codificante (circa 20–22 nucleotidi) che regolano l'espressione genica post-trascrizionalmente.",didesossiribonucleotidi:"Nucleotidi modificati (ddNTP) privi del gruppo 3'-OH necessario alla formazione del legame fosfodiesterico, usati nel sequenziamento Sanger per interrompere la sintesi del DNA."};
const term=k=>`<span class="term" tabindex="0" data-term="${k}">${k}</span>`;
const video=(id,title)=>`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${title}" loading="lazy" allowfullscreen></iframe></div>`;
const pages={
 genoma:()=>`<h2>🧬 Architettura del Genoma e Variabilità Umana</h2><article><h3>Composizione e Struttura</h3><p>Il genoma umano aploide è costituito da circa 3,3 × 10⁹ paia di basi e racchiude circa 20.000 geni codificanti. Le regioni codificanti costituiscono solo l'1% dell'intero genoma, mentre il resto è occupato da introni, sequenze regolatorie e DNA ripetuto.</p><p>La variabilità genetica individuale include alterazioni puntiformi come le ${term('SNV')} e variazioni strutturali su larga scala come le ${term('CNV')}.</p></article><article><h3>Simulatore di Struttura della Doppia Elica (Interattivo)</h3><p>Usa i comandi sottostanti per alternare lo stato di condensazione della cromatina in relazione all'accessibilità trascrizionale. La rappresentazione è schematica.</p><div class="interactive"><canvas id="dnaCanvas" width="600" height="200"></canvas><div class="controls"><button data-dna="eucromatina">Stato Eucromatina (Aperto)</button><button data-dna="eterocromatina">Stato Eterocromatina (Compatto)</button></div></div></article><article><h3>Video Approfondimento: Organizzazione del DNA</h3><p>Un'analisi di dettaglio sulla transizione tra doppia elica, nucleosomi e fibra di cromatina:</p>${video('gbSIBhFwQ4s','DNA Packaging')}</article>`,
 epigenetica:()=>`<h2>🔬 Epigenetica & RNA Non Codificanti</h2><article><h3>Regolazione Epigenetica</h3><p>L'espressione genica è modulata senza alterare la sequenza nucleotidica sottostante. Tra i meccanismi principali figurano l'acetilazione istonica, spesso associata a cromatina più accessibile (${term('eucromatina')}), e la metilazione delle isole CpG.</p><p>Inoltre, piccoli RNA non codificanti come i ${term('miRNA')} possono favorire la degradazione degli mRNA bersaglio e/o inibirne la traduzione.</p></article><article><h3>Video Approfondimento: Meccanismi Epigenetici</h3>${video('eYrQ0EhVCYA','Epigenetics')}</article>`,
 ricombinante:()=>`<h2>🧪 Tecnologie del DNA Ricombinante</h2><article><h3>Clonaggio Molecolare</h3><p>Il clonaggio può richiedere l'uso di enzimi di restrizione per tagliare il DNA in corrispondenza di sequenze specifiche, seguito dall'inserimento del frammento in un vettore plasmidico tramite DNA ligasi.</p><p>Il sequenziamento del vettore ricombinante può avvalersi del metodo Sanger basato sui ${term('didesossiribonucleotidi')} per l'interruzione di catena.</p></article>`,
 pcr:()=>`<h2>⚡ Simulazione Reazione a Catena della Polimerasi (PCR)</h2><article><h3>Fasi della PCR: Denaturazione, Annealing, Estensione</h3><div class="interactive"><canvas id="pcrCanvas" width="600" height="200"></canvas><div class="controls"><button data-step="1">1. Denaturazione (95°C)</button><button data-step="2">2. Annealing (55°C)</button><button data-step="3">3. Estensione (72°C)</button></div></div></article>`};
let dnaState='eucromatina',angle=0,frame=null;
function loadSection(key){if(frame!==null){cancelAnimationFrame(frame);frame=null}document.getElementById('content').innerHTML=pages[key]();document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===key));if(key==='genoma')animateDNA();if(key==='pcr')drawPCR(1)}
function animateDNA(){const canvas=document.getElementById('dnaCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');function render(){if(!canvas.isConnected)return;ctx.clearRect(0,0,600,200);const amp=dnaState==='eucromatina'?40:15,freq=dnaState==='eucromatina'?.03:.08;ctx.lineWidth=3;for(let x=0;x<600;x+=5){const y1=100+Math.sin(x*freq+angle)*amp,y2=100-Math.sin(x*freq+angle)*amp;ctx.strokeStyle='#334155';ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke();for(const [y,col] of [[y1,'#38bdf8'],[y2,'#4ade80']]){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill()}}angle+=.04;frame=requestAnimationFrame(render)}render()}
function drawPCR(step){const canvas=document.getElementById('pcrCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');ctx.clearRect(0,0,600,200);ctx.font='16px Segoe UI, sans-serif';ctx.fillStyle='#f8fafc';const labels={1:'Denaturazione (95°C): Separazione dei due filamenti',2:'Annealing (55°C): I primer si legano al DNA',3:'Estensione (72°C): La Taq sintetizza il DNA'};ctx.fillText(labels[step],20,30);ctx.fillStyle='#38bdf8';ctx.fillRect(50,60,500,8);ctx.fillStyle='#4ade80';ctx.fillRect(50,140,500,8);if(step>=2){ctx.fillStyle='#c084fc';ctx.fillRect(50,75,step===2?80:350,8);ctx.fillRect(step===2?470:200,125,step===2?80:350,8)}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-section]'),dna=e.target.closest('[data-dna]'),pcr=e.target.closest('[data-step]'),t=e.target.closest('[data-term]');if(nav)loadSection(nav.dataset.section);if(dna)dnaState=dna.dataset.dna;if(pcr)drawPCR(+pcr.dataset.step);if(t)showTerm(t.dataset.term)});function showTerm(k){document.getElementById('modalTitle').textContent=k;document.getElementById('modalText').textContent=dictionary[k]||'Definizione non disponibile.';document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}document.getElementById('close').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-term]'))showTerm(e.target.dataset.term)});loadSection('genoma');
</script></body></html>
